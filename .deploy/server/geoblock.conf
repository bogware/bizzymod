# /etc/bizzymod/geoblock.conf — countries blocked at the firewall on admin ports.
# One ISO 3166-1 alpha-2 country code per line. Lines starting with # are ignored.
# Run `sudo /usr/local/sbin/bizzymod-geoip-update` after editing.
#
# These countries are blocked on SSH and other inbound TCP. The game port
# (UDP 27015) is NOT geoblocked — legitimate players can still connect.
#
# Source: aggregated zone files from https://www.ipdeny.com/ipblocks/

# State-sponsored / persistent threat actors
cn   # China
ru   # Russia
ir   # Iran
kp   # North Korea
by   # Belarus

# High brute-force / botnet origin (often appears in fail2ban logs)
vn   # Vietnam
in   # India
br   # Brazil
ua   # Ukraine
ng   # Nigeria
ro   # Romania
