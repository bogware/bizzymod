# /etc/sysctl.d/99-bizzymod-hardening.conf
# Installed by .deploy/bootstrap.sh.
# Targeted hardening for a public-facing game server.

# ---- IP-stack hardening ----
# SYN flood mitigation
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_max_syn_backlog = 4096

# Drop spoofed packets (reverse-path filtering)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects (defense vs MITM redirect attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Don't accept source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Ignore broadcast pings (smurf amplification)
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Log packets with impossible source addresses
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Disable proxy ARP
net.ipv4.conf.all.proxy_arp = 0

# ---- Kernel hardening ----
# Hide /proc/kallsyms from non-root and dmesg from non-root
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2

# Restrict ptrace to same UID + descendants
kernel.yama.ptrace_scope = 1

# Don't honor sysrq from keyboard (no physical access expected)
kernel.sysrq = 0

# Restrict access to perf events
kernel.perf_event_paranoid = 3

# Protect against TOCTOU on hardlinks/symlinks
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Disable kexec (live-kernel replacement)
kernel.kexec_load_disabled = 1

# ---- Performance for a busy game server ----
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 4096
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 6
