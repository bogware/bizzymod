# /etc/ssh/sshd_config.d/99-bizzymod-hardening.conf
# Installed by .deploy/bootstrap.sh. Edit by re-running bootstrap or editing in place.
#
# Defaults that diverge from Ubuntu 24.04's stock sshd_config to harden against
# online brute-force without breaking the workflow (password auth stays on
# because GitHub Actions uses it).

# --- Identity & protocol ---
Protocol 2

# --- Who can log in ---
# Root cannot SSH directly. Use sudo from the admin user.
PermitRootLogin no
# AllowUsers is appended at install time by bootstrap.sh based on $SSH_USER.

# --- Password auth (kept ON because the deploy workflow uses sshpass) ---
# fail2ban + GeoIP do the heavy lifting; see /etc/fail2ban/jail.local
PasswordAuthentication yes
PermitEmptyPasswords no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no

# --- Public-key auth (always allowed, for when you decide to switch) ---
PubkeyAuthentication yes

# --- Login limits ---
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20

# --- Idle disconnect ---
# Disconnect clients idle for 5 minutes.
ClientAliveInterval 300
ClientAliveCountMax 0

# --- Reduce attack surface ---
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no
UseDNS no
TCPKeepAlive yes

# --- Banner (set in bootstrap if /etc/issue.net exists) ---
Banner /etc/issue.net

# --- Strong cryptography only ---
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group-exchange-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
