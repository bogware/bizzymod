// =====================================================================
// l4d_full_slot_bot_replace_fix.cfg
// =====================================================================
// Companion plugin to l4dmultislots (fbef0102/L4D1_2-Plugins/
// l4d_full_slot_bot_replace_fix). Fixes the bugs that happen when a
// server runs >4 survivor slots and a takeover happens with all slots
// occupied:
//
//   - Survivor takeover: all weapons drop on the ground + the survivor
//     gets removed instead of weapons disappearing into the void.
//   - Infected takeover / tank loss: force the SI to suicide and release
//     any pinned survivor instead of the survivor being stuck pinned.
//   - Tank loss-of-control: force tank to suicide instead of disappearing.
//
// Without this companion, the engine behaviors at >4 slots cause the
// "charger stop / witch attacks wrong target / character model change"
// bugs HarryPotter calls out in the MultiSlots thread. This is THE
// reason we ship it alongside MultiSlots — it's the missing-link fix
// for the 5+ player bugs your testers reported.
// =====================================================================

// 1 = plugin enabled. Set 0 to bypass without unloading.
l4d_full_slot_bot_replace_fix_enable "1"

// Delay before kicking infected bots after replacement (seconds).
// 0 = don't kick (default — preserves bot behavior).
l4d_full_slot_bot_replace_fix_kick_delay "0"
