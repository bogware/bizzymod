// =====================================================================
// l4d_superversus.cfg — overrides for Super Versus Reloaded plugin
// =====================================================================
// The plugin calls AutoExecConfig("l4d_superversus") in OnPluginStart,
// which execs THIS file every plugin load. That happens AFTER server1.cfg
// runs, so values here are the LAST WORD and override anything we set
// with sm_cvar in server1.cfg.
//
// CRITICAL CONTEXT — SVR behavior (verified against Merudo's .sp source,
// the matching upstream for our .smx):
//
//   public SpawnCheck()
//   {
//       int iSurvivor    = GetTeamPlayers(TEAM_SURVIVOR, true);
//       int iSurvivorMax = GetConVarInt(SurvivorLimit);
//       for(; iSurvivor < iSurvivorMax; iSurvivor++)
//           SpawnFakeClient();  // EAGER bot fill — no lazy mode
//   }
//
// SVR pre-fills survivor slots up to `l4d_survivor_limit` with
// SurvivorBot fakes, then humans take those bots over as they connect.
// Setting `l4d_survivor_limit "16"` on an empty / low-population coop
// server means 12+ AI SurvivorBots running pathing + targeting + I/O,
// PLUS the director's `director_tank_hpmulti * (survivors-4)` scaling
// applies to (humans + bots), producing tank HP × 12 and `director_si_more
// * (survivors-4)` extra SI per spawn. That combination crashed the
// Campaign server (testers saw heavy lag → drop). There is no SVR
// cvar to disable the eager fill.
//
// Trade-off: lower `l4d_survivor_limit` = fewer bots = lighter load,
// but caps total survivors at that number. 8 picks the sweet spot —
// up to 8 humans can play (replacing bots as they join), and at low
// population the bot count + director scaling stay manageable.
// =====================================================================

// How many survivors the plugin maintains. Plugin default: 4.
// 8 = 4 humans + 4 SurvivorBots in low-pop, scaling down to 0 bots at
// 8 humans. Above 8 humans, joiners go to spectator. See header for the
// full reasoning.
l4d_survivor_limit "8"

// Late joiners spawn alive (first time only). Plugin default: 1.
l4d_respawn_on_join "1"

// One extra first-aid kit per extra survivor at saferoom. Plugin default: 1.
l4d_extra_first_aid "1"

// Lobby reservation clearing — requires the left4downtown extension,
// which we don't ship. The l4dtoolz `sv_force_unreserved` cvar in
// server1.cfg handles unreservation for us. Setting this to 0 here is
// defensive — keeps the plugin from poking at a native that isn't bound.
l4d_killreservation "0"

// In versus/scavenge, spawn SI bots if human SI < l4d_infected_limit.
// We're coop-only so this is functionally a no-op, but match plugin default.
l4d_versus_si_more "1"

// AFK handling on versus: 0=nothing, 1=idle, 2=spectator, 3=kick.
// Coop-only here — match plugin default.
l4d_versus_afk "0"

// Director scaling multipliers — these MUST be set with director_auto_difficulty 1
// to take effect (set in server1.cfg). The formula is `multi * (survivors-4)`,
// so at 8 survivors the effective multiplier is `cvar * 4`.
//
// Values restored to LEGACY BIZZYMOD INTENT (legacy/cfg/server1.cfg lines
// 14-19 under "//SuperVersus"). At our 8-survivor cap:
//
//   tank_hpmulti=1 * (8-4) = 4.0x base tank HP (chunky tank)
//   ci_multi=1     * (8-4) = 4.0x common spawn rate (heavy hordes)
//   si_more=2              = +8 extra SI total (2 per extra survivor)
//
// Legacy ran the same values at survivor_limit 16, but SVR was broken
// (missing gamedata) so the multipliers never actually applied. With SVR
// now working AND a 16-cap, PR #3 hit tank HP * 12 and +24 SI — the
// crash. The 8-cap is what makes these legacy values safe.
director_tank_hpmulti  "1"
director_si_hpmulti    "0"
director_ci_multi      "1"
director_si_more       "2"
