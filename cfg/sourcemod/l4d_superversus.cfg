// =====================================================================
// l4d_superversus.cfg — overrides for Super Versus Reloaded plugin
// =====================================================================
// The plugin calls AutoExecConfig("l4d_superversus") in OnPluginStart,
// which execs THIS file every plugin load. That happens AFTER server1.cfg
// runs, so values here are the LAST WORD and override anything we set
// with sm_cvar in server1.cfg.
//
// Without this file present in the repo, SourceMod auto-generates a
// stale copy on the server populated with the plugin's source defaults
// (l4d_survivor_limit "4", etc.). That stale auto-cfg was the cause of
// the "shows 16 but holds at 4" symptom even after the gamedata fix.
// =====================================================================

// How many survivors the plugin maintains. Plugin default: 4.
// Engine survivor_limit (in server1.cfg) raises the cap; this cvar tells
// the plugin to actually fill it.
l4d_survivor_limit "4"        // bizzymod: bot-fill target (max 3 bots@1 human, 0@4). humans fill 5-16 via engine survivor_limit 16

// Late joiners spawn alive (first time only). Plugin default: 1.
l4d_respawn_on_join "1"

// One extra first-aid kit per extra survivor at saferoom. Plugin default: 1.
l4d_extra_first_aid "0"      // legacy: no extra medkits

// Lobby reservation clearing — requires the left4downtown extension,
// which we don't ship. The l4dtoolz `sv_force_unreserved` cvar in
// server1.cfg handles unreservation for us. Setting this to 0 here is
// defensive — keeps the plugin from poking at a native that isn't bound.
l4d_killreservation "0"

// In versus/scavenge, spawn SI bots if human SI < l4d_infected_limit.
// We're coop-only so this is functionally a no-op, but match plugin default.
l4d_versus_si_more "1"

// AFK handling on versus: 0=nothing, 1=idle, 2=spectator, 3=kick.
// Coop-only here — match plugin default.
l4d_versus_afk "0"

// Director scaling multipliers — these MUST be set with director_auto_difficulty 1
// to take effect (set in server1.cfg). Listed here for completeness so the
// auto-cfg has the full SuperVersus surface area documented in one place.
director_tank_hpmulti "0.25"  // legacy-effective tank scaling (was 1 = 4x too aggressive)
director_si_hpmulti    "0"
director_ci_multi      "1"
director_si_more       "2"
