// =====================================================================
// l4d2_explosive_cars.cfg — overrides for the Explosive Cars plugin
// =====================================================================
// AutoExecConfig("l4d2_explosive_cars") in the plugin execs THIS file
// every plugin load, AFTER server1.cfg runs. Without this file checked
// into the repo, SourceMod auto-creates one on the server with the .sp
// source defaults (notably `l4d2_explosive_cars_health "5000"`) — which
// makes cars take so much damage before triggering smoke that testers
// report cars "don't take damage and explode" in normal play.
//
// Damage model (per AtomicStryker's source, the bizzymod-style variant):
//
//   MaxDamageHandle = l4d2_explosive_cars_health / 5
//
//   tdamage >= 1 * MaxDamageHandle  →  white smoke (light damage)
//   tdamage >= 2 * MaxDamageHandle  →  black smoke
//   tdamage >= 3 * MaxDamageHandle  →  small fire
//   tdamage >= 4 * MaxDamageHandle  →  huge fire
//   tdamage >  5 * MaxDamageHandle  →  EXPLODE + launch + horde
//
// At health=1000 the first smoke appears after ~200 dmg (a magnum mag
// or a few shotgun blasts) and explosion at ~1000 dmg (one propane tank
// + sustained fire, or a tank punch).
// =====================================================================

// Total damage the car absorbs before exploding. Plugin default is 5000
// (LossyDragon) / 3500 (AtomicStryker) — both feel "indestructible" in
// coop. 1000 gives the bizzymod feel: smoke after sustained fire,
// explode when a propane goes off or tank punches it.
l4d2_explosive_cars_health "1000"

// Explosion blast radius. Bizzymod legacy value.
l4d2_explosive_cars_radius "300"

// Explosion physics impulse (how hard surrounding props get tossed).
l4d2_explosive_cars_power "300"

// Damage dealt to players caught in the explosion.
l4d2_explosive_cars_damage "100"

// Time before the residual fire trace from the explosion expires (sec).
l4d2_explosive_cars_trace "25"

// Should the explosion trigger a panic event (horde)? 1 = yes.
l4d2_explosive_cars_panic "1"

// Chance the explosion triggers a horde. 100 = always (legacy behavior).
l4d2_explosive_cars_panic_chance "100"

// Should infected damage trigger the explosion? 1 = yes (tanks etc.).
l4d2_explosive_cars_infected "1"

// Tank damage to cars per hit. 0 = use engine default (999), which means
// one tank punch one-shots any car. Matches legacy "tank punch = boom."
l4d2_explosive_cars_tank "0"

// Time to wait before despawning the wrecked car to clear the path (sec).
// 0 = leave it. Plugin default.
l4d2_explosive_cars_removetime "0"

// On which maps to disable the plugin (semicolon-separated). "none" = all on.
l4d2_explosive_cars_unload "none"

// Should one car's explosion damage other nearby cars? 1 = chain reaction on.
l4d2_explosive_cars_explosion_damage "1"

// How often (sec) the residual fire trace pulses damage.
l4d2_explosive_cars_trace_interval "0.4"

// How many EXTRA inferno (fire) entities to spawn on top of the explosion.
// 0 keeps the post-explosion fire from being excessive — bizzymod legacy
// value. (Default 2 felt overly hazardous in coop.)
l4d2_explosive_cars_inferno_count "0"

// Damage multiplier for fire ticks landing on a car (plugin default).
l4d2_explosive_cars_fire_multiplier "2.42"

// Damage multiplier for explosions hitting cars: propane, pipe bombs,
// grenade launcher rounds, etc. Plugin default.
l4d2_explosive_cars_explosion_multiplier "45.67"
