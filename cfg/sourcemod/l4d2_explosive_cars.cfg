// =====================================================================
// l4d2_explosive_cars.cfg — overrides for the Explosive Cars plugin
// =====================================================================
// AutoExecConfig("l4d2_explosive_cars") in the plugin execs THIS file
// every plugin load, AFTER server1.cfg runs. So values here are the
// LAST WORD.
//
// VALUES SET TO LEGACY EXACTLY per user direction (2026-05-30):
//   - Older-legacy/cfg/server1.cfg only set _inferno_count "0" and
//     _radius "300" explicitly; everything else inherited the
//     AtomicStryker plugin defaults from the .sp source.
//   - The wide-open "WAR MODE" feeling testers reported came from the
//     SuperVersus eager-bot-fill at 8-cap interacting with director
//     scaling and lowered car HP (PR #3 set health=1000 making cars
//     too fragile). Now that we're on MultiSlots Improved + demand-
//     driven bot spawn, cars at legacy 5000 HP behave the way they
//     did in older-legacy.
//
// Damage model (per AtomicStryker's source):
//
//   MaxDamageHandle = l4d2_explosive_cars_health / 5
//
//   tdamage >= 1 * MaxDamageHandle  →  white smoke (light damage)
//   tdamage >= 2 * MaxDamageHandle  →  black smoke
//   tdamage >= 3 * MaxDamageHandle  →  small fire
//   tdamage >= 4 * MaxDamageHandle  →  huge fire
//   tdamage >  5 * MaxDamageHandle  →  EXPLODE + launch + horde
//
// At health=5000 cars require sustained shotgun fire / propanes / tank
// to break. Casual stray bullets and infected swings don't chain-explode
// the whole street.
// =====================================================================

// Plugin default: 5000. Older-legacy never overrode this, so it ran at
// 5000 — what testers remember as the "right" feel.
l4d2_explosive_cars_health "5000"

// Explosion blast radius. Older-legacy explicit value: 300 (vs plugin
// default 420). Kept.
l4d2_explosive_cars_radius "300"

// Explosion physics impulse (how hard surrounding props get tossed).
// Plugin default.
l4d2_explosive_cars_power "300"

// Damage dealt to players caught in the explosion. Plugin default.
l4d2_explosive_cars_damage "100"

// Time before the residual fire trace from the explosion expires (sec).
// Plugin default.
l4d2_explosive_cars_trace "25"

// 1 = explosion triggers a panic event (horde). Plugin / legacy default.
l4d2_explosive_cars_panic "1"

// 100 = always-horde-on-explode. Plugin / legacy default.
l4d2_explosive_cars_panic_chance "100"

// 1 = infected damage triggers explosion (tank punches, claws, etc.).
// Plugin / legacy default. Tanks one-shot at this setting per the next
// cvar.
l4d2_explosive_cars_infected "1"

// Tank damage to cars per hit. 0 = engine default (999), one tank punch
// = boom. Plugin / legacy default.
l4d2_explosive_cars_tank "0"

// Time to wait before despawning the wrecked car. 0 = leave it. Plugin
// default.
l4d2_explosive_cars_removetime "0"

// Disable on which maps. "none" = all on. Plugin default.
l4d2_explosive_cars_unload "none"

// 1 = chain reaction (one car's blast damages neighboring cars). Plugin
// default.
l4d2_explosive_cars_explosion_damage "1"

// How often the residual fire trace pulses damage. Plugin default.
l4d2_explosive_cars_trace_interval "0.4"

// Older-legacy explicit value: 0 (plugin default is 2). Suppresses extra
// post-explosion infernos.
l4d2_explosive_cars_inferno_count "0"

// Damage multiplier for fire ticks landing on a car. Plugin default.
l4d2_explosive_cars_fire_multiplier "2.42"

// Damage multiplier for explosions hitting cars: propane, pipe bombs,
// grenade launcher rounds, etc. Plugin default.
l4d2_explosive_cars_explosion_multiplier "45.67"
