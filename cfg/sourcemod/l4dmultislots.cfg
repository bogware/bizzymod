// =====================================================================
// l4dmultislots.cfg — overrides for HarryPotter's MultiSlots Improved
// =====================================================================
// The plugin calls AutoExecConfig("l4dmultislots") in OnPluginStart,
// which execs THIS file every plugin load — so anything we set here is
// the LAST WORD over server1.cfg.
//
// We swapped to MultiSlots Improved (fbef0102/L4D1_2-Plugins/l4dmultislots,
// v7.4 dated 2026-04-16) because SuperVersus's design — eager pre-fill
// of survivor slots to l4d_survivor_limit — produced "3 Coaches in an
// empty server", character duplication, and AI overload at our 8-cap.
//
// MultiSlots Improved is DEMAND-DRIVEN: it only spawns a new bot when
// human #5+ joins AND no idle bot is available to take over. When the
// human leaves, the bot is kicked. So a 4-human server runs 4 humans +
// 0 extra bots — vanilla load — and only ever adds bots while there
// are humans waiting to fill them.
//
// CRITICAL — the plugin's readme says "Do not modify cvar survivor_limit
// value in your cfg" — MultiSlots manages the engine survivor_limit
// itself. We removed our `sm_cvar survivor_limit` line from server1.cfg
// to comply.
// =====================================================================

// Survivor cap. Plugin default: 10. We're starting at 8 for the campaign
// server — 4 humans + up to 4 lazy-spawned bots. Bump to 10 or 12 once
// we've validated the new setup with testers.
l4d_multislots_max_survivors "8"

// Minimum survivors (vanilla floor). Don't drop below 4 — engine kicks
// weapons and triggers mission-loss conditions if survivors < 4.
l4d_multislots_min_survivors "4"

// 0 = new joiners spawn ALIVE immediately. (Default. Setting this to >0
// would spawn them dead for N seconds; we want alive-on-join.)
l4d_multislots_alive_bot_time "0"

// 0 = DO NOT auto-spawn bots at round_start to fill the cap. This is the
// switch that prevents the SVR-style eager pre-fill. With it at 0, bots
// only spawn on-demand when a human #5+ tries to join. Critical setting.
l4d_multislots_spawn_survivors_roundstart "0"

// 1 = delete leftover items from kicked bots (clean up when humans leave).
l4d_multislots_bot_items_delete "1"

// New survivor base HP + temp buff HP when they spawn in via the plugin.
// 80 + 20 buff = effectively 100 HP for a few seconds. Default values.
l4d_multislots_respawnhp "80"
l4d_multislots_respawnbuffhp "20"
l4d_multislots_respawn_invincibletime "3.0"

// Spectator prompt frequency (sec). How often the plugin reminds idle
// players they can `!join`. 25 = once every 25 seconds. Plugin default.
l4d_multislots_spec_message_interval "25"

// Default L4D2 weapon loadout for plugin-spawned survivors:
//   firstweapon   19 = M16 (best Tier-1/T2 default for coop)
//   secondweapon  5  = Magnum pistol
//   thirdweapon   4  = pipe bomb
//   forthweapon   0  = no medkit
//   fifthweapon   0  = no pills
l4d_multislots_firstweapon "19"
l4d_multislots_secondweapon "5"
l4d_multislots_thirdweapon "4"
l4d_multislots_forthweapon "0"
l4d_multislots_fifthweapon "0"

// Extra first-aid kits at saferoom + finale. Mirrors the SVR cvar we used
// to set. Helpful when survivor count is > 4.
l4d_multislots_saferoom_extra_first_aid "1"
l4d_multislots_finale_extra_first_aid "1"

// 0 = block second free spawn (default). Prevents abuse where players
// disconnect to respawn at full health.
l4d_multislots_no_second_free_spawn "0"

// 1 = dead-bot spawn method follows plugin (default).
l4d_multislots_dead_bot_method "1"

// 1 = handle crash-rejoin so disconnected players can resume their slot.
l4d_multislots_free_spawn_crash_player "1"

// 0 = don't block sm_join. Players can self-join when slots free up.
l4d_multislots_join_command_block "0"

// Versus-specific cvars (no-op in coop but kept at sane defaults).
l4d_multislots_versus_command_balance "1"
l4d_multislots_versus_teams_unbalance_limit "1"

// 1 = require Steam ID auth for plugin commands (prevents anon abuse).
l4d_multislots_steamid_validate "1"
