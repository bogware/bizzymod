// =====================================================================
// server.cfg -- overrides zonemod's competitive server.cfg on a coop server.
// =====================================================================
// L4D2 auto-execs server.cfg (the default servercfgfile) after the first map
// -- and it does so even though the launch passes +servercfgfile server1.cfg
// (that token is rejected as "Unknown command" on this L4D2 build). zonemod
// ships a COMPETITIVE server.cfg that forces:
//     sv_allow_lobby_connect_only 0     (excludes us from public matchmaking)
//     sv_search_key "CompetitiveRework" (restricts lobby search)
// Neither is wanted on a public coop server. This override neutralizes them
// and hands off to server1.cfg, the single source of truth (which ends with
// `exec campaign.cfg`). campaign.cfg re-asserts these two as the final word.
// =====================================================================
sv_allow_lobby_connect_only 1
sv_search_key ""
exec server1.cfg
