// =====================================================================
// server.cfg -- coop override / fallback for zonemod's competitive server.cfg.
// =====================================================================
// The launch line passes `+servercfgfile server1.cfg`, so on this build the
// engine auto-execs server1.cfg (NOT server.cfg) after the first map, and
// server1.cfg is the real single source of truth (it ends with
// `exec campaign.cfg`). This file is a belt-and-suspenders fallback: if a
// build ever ignores +servercfgfile and falls back to the default server.cfg,
// this neutralizes zonemod's COMPETITIVE server.cfg (sv_pure 2, a
// "CompetitiveRework" search key, etc.) -- not wanted on a public coop server
// -- sets our proven-working public values, and hands off to server1.cfg.
// campaign.cfg re-asserts these two as the final word.
// =====================================================================
sv_allow_lobby_connect_only 0     // accept direct + lobby joins (public)
sv_search_key "bizzymod"          // legacy bizzymod matchmaking search key
exec server1.cfg
