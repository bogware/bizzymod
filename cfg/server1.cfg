// =====================================================================
// server1.cfg — Bizzymod Campaign primary server config
// =====================================================================
// This is exec'd by srcds at startup. It sets server identity, cvars,
// and finally hands plugin loading off to ONE file: campaign.cfg.
//
// There is no matchmode infrastructure here. No sm_matchmode. No
// confogl_match_execcfg_plugins. No mode-switching. This server runs
// ONE game mode (coop campaign) and ONE plugin set (campaign.cfg).
// =====================================================================

// ---------------------------------------------------------------------
// [Identity]
// ---------------------------------------------------------------------
hostname "#{Server_Name}#"
rcon_password "#{RCON_Pass}#"

sv_steamgroup "38693222"            // bizzymod Steam group (groupID64 103582791468214630)
sv_steamgroup_exclusive "0"         // 0 = public can join; group just shows server under Group → Servers

motdfile "mymotd.txt"               // Edit mymotd.txt, not motd.txt (Valve updates overwrite motd.txt)
hostfile "myhost.txt"               // Edit myhost.txt, not host.txt (same reason)

// ---------------------------------------------------------------------
// [Gamemode]
// ---------------------------------------------------------------------
// DO NOT pin mp_gamemode here. The Steam lobby system sets mp_gamemode
// on the server when a player joins (coop / versus / realism / mutationN
// / scavenge / survival / etc.). Pinning it blocks players from starting
// Realism, Hard Eight, and other mutations.
//
// vanilla L4D2 default at boot is "coop", which is all we need. The
// matchmode-plugin auto-loading bug that previously caused versus-like
// gameplay leaks has been fixed (plugins/bizzymod/ -> optional/bizzymod/),
// so a hard pin here is no longer needed as a workaround.

// ---------------------------------------------------------------------
// [Difficulty + survivor limits]
// ---------------------------------------------------------------------
z_difficulty "Impossible"
sm_cvar z_difficulty "Impossible"
sm_cvar sv_maxplayers 16
sm_cvar survivor_limit 16
sm_cvar sv_visiblemaxplayers "-1"
sm_cvar mv_maxplayers 30                 // Prevents constant reset of sv_maxplayers on map change

// ---------------------------------------------------------------------
// [SuperVersus Reloaded — l4d_superversus.smx cvars]
// ---------------------------------------------------------------------
// The plugin needs to be told the target survivor count explicitly via
// its own cvar; the engine `survivor_limit` alone isn't enough. Without
// this, the plugin holds the team at the engine default of 4 even when
// sv_maxplayers / survivor_limit are raised — players see slots 4/16
// but slots 5-16 won't accept connections (the engine has no SurvivorBot
// to take over because the plugin never spawned extras).
sm_cvar l4d_survivor_limit 16            // plugin's own survivor target
sm_cvar l4d_respawn_on_join 1            // late joiners spawn alive (first time)
sm_cvar l4d_extra_first_aid 1            // one extra med kit per extra survivor
sm_cvar l4d_killreservation 0            // left4downtown extension not installed; no-op anyway

// ---------------------------------------------------------------------
// [Director tweaks — SuperVersus-style scaling for coop campaign]
// ---------------------------------------------------------------------
// These multipliers are read by l4d_superversus.smx and scale by
// (survivors - 4). They require director_auto_difficulty 1.
sm_cvar director_auto_difficulty "1"
sm_cvar director_tank_hpmulti "1"
sm_cvar director_si_hpmulti "0"
sm_cvar director_ci_multi "1"
sm_cvar director_si_more "2"

// ---------------------------------------------------------------------
// [Lobby / join behavior]
// ---------------------------------------------------------------------
// Public, no search key, lobby join allowed.
sv_allow_lobby_connect_only "0"
sm_cvar sv_allow_lobby_connect_only "0"

// sv_force_unreserved is the cvar that fixes "not enough open slots in
// the session" past slot 4. Provided by l4dtoolz (a MetaMod plugin that
// zonemod's release tarball drops at addons/l4dtoolz/l4dtoolz_mm.so).
// Without this, the L4D2 engine reserves the original lobby's 4 slots
// even after we expand sv_maxplayers; lobby/Steam matchmaking still
// reports "session full" for slots 5-16 to clients. Setting this to 1
// tells l4dtoolz to permanently mark the server as unreserved so all
// 16 slots are joinable from lobby, Steam invite, or server browser.
sv_force_unreserved "1"
sm_cvar sv_force_unreserved "1"

// ---------------------------------------------------------------------
// [Cars / explosives]
// ---------------------------------------------------------------------
sm_cvar l4d2_explosive_cars_inferno_count 0
sm_cvar l4d2_explosive_cars_radius 300

// [Stats]
// The old l4d_stats plugin has been replaced by bogware/bizzymod-stats
// (cfg/sourcemod/bizzymod_stats.cfg). Tuning lives there, not here.

// ---------------------------------------------------------------------
// [File consistency / addon control]
// ---------------------------------------------------------------------
sv_consistency "0"
sv_pure "0"
sv_pure_kick_clients "0"
sm_cvar l4d2_addons_eclipse 1         // Server-side addon enforcement: 1 = enabled

// ---------------------------------------------------------------------
// [Logging]
// ---------------------------------------------------------------------
log on
sv_logecho 0
sv_logfile 1
sv_log_onefile 1
sv_logbans 1
sv_logflush 0
sv_logsdir logs

// ---------------------------------------------------------------------
// [Wait commands disabled]
// ---------------------------------------------------------------------
sm_cvar sv_allow_wait_command 0

// ---------------------------------------------------------------------
// [Networking — 100 tick]
// When changing tickrate:
//   - rate / splitpacket = tickrate * 1000
//   - cmdrate / updaterate = tickrate
// ---------------------------------------------------------------------
sm_cvar sv_minrate 100000
sm_cvar sv_maxrate 100000
sm_cvar sv_minupdaterate 100
sm_cvar sv_maxupdaterate 100
sm_cvar sv_mincmdrate 100
sm_cvar sv_maxcmdrate 100
sm_cvar sv_client_min_interp_ratio -1
sm_cvar sv_client_max_interp_ratio 0
sm_cvar nb_update_frequency 0.014
sm_cvar net_splitpacket_maxrate 50000
sm_cvar fps_max 0
sm_cvar tick_door_speed 1.3

// ---------------------------------------------------------------------
// [Misc tweaks]
// ---------------------------------------------------------------------
sm_cvar mp_autoteambalance 0
sm_cvar sv_unlag_fixstuck 1
sm_cvar z_brawl_chance 0
sm_cvar sv_maxunlag 1
sm_cvar sv_forcepreload 1
sm_cvar sv_client_predict 1
sm_cvar sv_client_cmdrate_difference 0
sm_cvar sv_max_queries_sec_global 10
sm_cvar sv_max_queries_sec 3
sm_cvar sv_max_queries_window 10
sm_cvar sv_player_stuck_tolerance 5
sm_cvar sv_stats 0
sm_cvar sv_clockcorrection_msecs 25

// =====================================================================
// PLUGIN LOADING — single source of truth
// =====================================================================
// Everything plugin-related lives in campaign.cfg. Do not add `sm
// plugins load` lines here; add them there.
exec campaign.cfg
