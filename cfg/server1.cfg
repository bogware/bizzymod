// =====================================================================
// server1.cfg — Bizzymod Campaign primary server config
// =====================================================================
// This is exec'd by srcds at startup. It sets server identity, cvars,
// and finally hands plugin loading off to ONE file: campaign.cfg.
//
// There is no matchmode infrastructure here. No sm_matchmode. No
// confogl_match_execcfg_plugins. No mode-switching. This server runs
// ONE game mode (coop campaign) and ONE plugin set (campaign.cfg).
// =====================================================================

// ---------------------------------------------------------------------
// [Identity]
// ---------------------------------------------------------------------
hostname "#{Server_Name}#"
rcon_password "#{RCON_Pass}#"

sv_steamgroup "38693222"            // bizzymod Steam group (groupID64 103582791468214630)
sv_steamgroup_exclusive "0"         // 0 = public can join; group just shows server under Group → Servers

// sv_search_key — uncomment to lock matchmaking to clients who use the
// same key (mm_search_key "bizzymod" on the client side). Restricts
// public Steam matchmaking from discovering this server. Legacy bizzymod
// had this set to "bizzymod" for community-only access. We're keeping it
// off so vanilla matchmaking players can find us. Set if you want to
// flip back to community-only.
//sv_search_key "bizzymod"

motdfile "mymotd.txt"               // Edit mymotd.txt, not motd.txt (Valve updates overwrite motd.txt)
hostfile "myhost.txt"               // Edit myhost.txt, not host.txt (same reason)

// ---------------------------------------------------------------------
// [Gamemode]
// ---------------------------------------------------------------------
// DO NOT pin mp_gamemode here. The Steam lobby system sets mp_gamemode
// on the server when a player joins (coop / versus / realism / mutationN
// / scavenge / survival / etc.). Pinning it blocks players from starting
// Realism, Hard Eight, and other mutations.
//
// vanilla L4D2 default at boot is "coop", which is all we need. The
// matchmode-plugin auto-loading bug that previously caused versus-like
// gameplay leaks has been fixed (plugins/bizzymod/ -> optional/bizzymod/),
// so a hard pin here is no longer needed as a workaround.

// ---------------------------------------------------------------------
// [Difficulty + slot caps]
// ---------------------------------------------------------------------
// sv_maxplayers 16 = total slots. Older-legacy used 16 too. Note that
// HarryPotter's MultiSlots Improved (loaded via campaign.cfg) requires
// the SRCDS LAUNCH WRAPPER to include `-maxplayers 31` for l4dtoolz
// (Accelerator74's fork) to actually allow >18 slots — without that
// launch arg, the plugin logs a warning and stays at the engine's
// default 4-survivor cap. The launch wrapper lives server-side at
// /home/campaign/srcds-launch.sh and needs the arg added separately
// from this PR; see this PR's description for the steps.
//
// CRITICAL — do NOT set `sm_cvar survivor_limit X` here. MultiSlots
// Improved manages the engine survivor_limit cvar itself (its OnPluginStart
// calls SetBounds() on survivor_limit and bumps it dynamically). The
// plugin's readme is explicit: "Do not modify cvar survivor_limit value
// in your cfg." Older-legacy DID set it (to 16) but that was harmless
// because their SVR was broken; here it would fight MultiSlots.
z_difficulty "Impossible"
sm_cvar z_difficulty "Impossible"
sm_cvar sv_maxplayers 16
sm_cvar sv_visiblemaxplayers "-1"
sm_cvar mv_maxplayers 30                 // Prevents constant reset of sv_maxplayers on map change

// ---------------------------------------------------------------------
// [MultiSlots Improved — survivor cap + take-over edge-case fixer]
// ---------------------------------------------------------------------
// Loaded via campaign.cfg. Auto-cfgs at:
//   cfg/sourcemod/l4dmultislots.cfg
//   cfg/sourcemod/l4d_full_slot_bot_replace_fix.cfg
// Those are the LAST WORD (AutoExecConfig fires AFTER server1.cfg).
// The lines here are advisory defaults only — they help readers see
// the surface area at-a-glance.
sm_cvar l4d_multislots_max_survivors      "8"   // cap; bump later if testers want
sm_cvar l4d_multislots_min_survivors      "4"   // vanilla floor
sm_cvar l4d_multislots_spawn_survivors_roundstart "0"  // KEY: no eager pre-fill
sm_cvar l4d_multislots_alive_bot_time     "0"   // joiners spawn alive
sm_cvar l4d_multislots_saferoom_extra_first_aid "1"
sm_cvar l4d_multislots_finale_extra_first_aid   "1"

// ---------------------------------------------------------------------
// [Director tweaks — legacy bizzymod values, verbatim]
// ---------------------------------------------------------------------
// PRESERVED FROM LEGACY VERBATIM per user direction — these are the
// values the //SuperVersus block had in legacy/cfg/server1.cfg L14-19
// and older-legacy/cfg/server1.cfg L54-59. They scale by (survivors-4)
// when director_auto_difficulty=1, so at MultiSlots' 8-cap with full
// pop:
//
//   director_tank_hpmulti  1 → tank HP × 5 at 8 surv  (intentional chunky tank)
//   director_si_hpmulti    0 → SI HP unscaled
//   director_ci_multi      1 → CI spawn × 5 at 8 surv (intentional heavy horde)
//   director_si_more       2 → +8 SI at 8 surv         (intentional +2/extra)
//
// In low population (4 surv), all of these multiply by 0 → vanilla coop.
// In legacy, with SuperVersus broken (no gamedata), survivors never
// climbed above 4, so these never fired even though they were set. Now
// that MultiSlots is doing actual >4 expansion, they will fire when 5+
// humans join — and per user direction, we ship them at legacy values
// without softening. If "WAR MODE" is too much, the right knob to turn
// is l4d_multislots_max_survivors lower, not these multipliers.
sm_cvar director_auto_difficulty "1"
sm_cvar director_tank_hpmulti    "1"
sm_cvar director_si_hpmulti      "0"
sm_cvar director_ci_multi        "1"
sm_cvar director_si_more         "2"

// ---------------------------------------------------------------------
// [Lobby / join behavior]
// ---------------------------------------------------------------------
// Public, no search key, lobby join allowed.
sv_lan "0"                              // Public — must be 0 for Steam matchmaking + mm_dedicated_force_servers to consider this host.
sv_allow_lobby_connect_only "0"
sm_cvar sv_allow_lobby_connect_only "0"

// sv_force_unreserved is the cvar that fixes "not enough open slots in
// the session" past slot 4. Provided by l4dtoolz (a MetaMod plugin that
// zonemod's release tarball drops at addons/l4dtoolz/l4dtoolz_mm.so).
// Without this, the L4D2 engine reserves the original lobby's 4 slots
// even after we expand sv_maxplayers; lobby/Steam matchmaking still
// reports "session full" for slots 5-16 to clients. Setting this to 1
// tells l4dtoolz to permanently mark the server as unreserved so all
// slots are joinable from lobby, Steam invite, or server browser.
//
// Verified against the deployed l4dtoolz_mm.so (zonemod v1.0.0): the
// build exports exactly three cvars — sv_force_unreserved, sv_maxplayers,
// sv_allow_lobby_connect_only. The older `sv_removehumanlimit` cvar
// from community guides is from a different fork and is NOT a cvar on
// this build. sv_force_unreserved covers what sv_removehumanlimit used
// to do.
sv_force_unreserved "1"
sm_cvar sv_force_unreserved "1"

// One-shot defensive unreservation at boot. sv_force_unreserved 1 is the
// passive always-on setting; these admin commands fire once on cfg
// execution and immediately clear any reservation that exists at
// startup. Belt-and-suspenders alongside the cvar. Mirrors legacy
// bizzymod's server1.cfg (lines 29-30 under the lobby block).
//
//   sm_l4dd_unreserve  → left4dhooks command (if extension loaded).
//   sm_unreserve       → generic SourceMod base command.
// If either command is unrecognized in a given build (extension not
// loaded), srcds prints "unknown command" and moves on — harmless.
sm_l4dd_unreserve
sm_unreserve

// ---------------------------------------------------------------------
// [How players join this server — known issues and the reliable path]
// ---------------------------------------------------------------------
// TL;DR — direct connect from server browser is the reliable path. The
// `mm_dedicated_force_servers` flow has a known Valve quirk in current
// L4D2 where the lobby goes to infinite loading and then falls back to
// local server. We don't have control over Valve's matchmaking; the
// workaround below is the documented fix.
//
// RELIABLE PATH (works today):
//   1. Open in-game console (`)
//   2. type: connect <DEV_HOST>:27015
//   3. ...or use the Server Browser to find "Bizzymod Campaign" and
//      double-click.
//
// LOBBY PATH (works sometimes — Valve issue):
//   HOST (client console, BEFORE starting the lobby):
//     mm_dedicated_force_servers "<DEV_HOST>:27015"
//   Then create a Coop Campaign lobby in-game. Steam matchmaking is
//   supposed to auto-assign this server to the lobby. KNOWN ISSUE: as
//   of Valve's recent L4D2 patches the lobby step sometimes stalls in
//   an infinite loading screen and then drops the host to a local
//   listen server (their friends never see the dedicated server). See
//   community report:
//     https://steamcommunity.com/app/550/discussions/0/4347732779397797809/
//   If that happens, fall back to the direct connect path above and
//   share your IP with friends manually.
//
// COMMON CVAR-NAME TYPO:
//   `mm_forcededicatedserver`   ← NOT a real cvar, won't do anything.
//   `mm_dedicated_force_servers` ← correct (plural servers, underscores).
//
// WHY the server is configured correctly for both paths:
//   sv_lan 0                          (public)
//   sv_steamgroup_exclusive 0          (non-group players allowed)
//   sv_force_unreserved 1              (lobby reservation cleared)
//   sv_allow_lobby_connect_only 0      (direct connect allowed too)
//   mp_gamemode unpinned at boot       (vanilla default "coop", lobby
//                                        sets it on assign; supports
//                                        realism / mutations too)

// ---------------------------------------------------------------------
// [Cars / explosives]
// ---------------------------------------------------------------------
// Real config lives in cfg/sourcemod/l4d2_explosive_cars.cfg (auto-cfg
// is the last word). The two lines below match older-legacy verbatim;
// they're advisory defaults for readers. All other plugin cvars (health,
// damage, infected-can-trigger, tank one-shot, etc.) are at the plugin's
// source defaults to match older-legacy behavior.
sm_cvar l4d2_explosive_cars_inferno_count 0
sm_cvar l4d2_explosive_cars_radius 300

// [Stats]
// The old l4d_stats plugin has been replaced by bogware/bizzymod-stats
// (cfg/sourcemod/bizzymod_stats.cfg). Tuning lives there, not here.

// ---------------------------------------------------------------------
// [File consistency / addon control]
// ---------------------------------------------------------------------
sv_consistency "0"
sv_pure "0"
sv_pure_kick_clients "0"
sm_cvar l4d2_addons_eclipse 1         // Server-side addon enforcement: 1 = enabled

// ---------------------------------------------------------------------
// [Logging]
// ---------------------------------------------------------------------
log on
sv_logecho 0
sv_logfile 1
sv_log_onefile 1
sv_logbans 1
sv_logflush 0
sv_logsdir logs

// ---------------------------------------------------------------------
// [Wait commands disabled]
// ---------------------------------------------------------------------
sm_cvar sv_allow_wait_command 0

// ---------------------------------------------------------------------
// [Networking — 100 tick]
// When changing tickrate:
//   - rate / splitpacket = tickrate * 1000
//   - cmdrate / updaterate = tickrate
// ---------------------------------------------------------------------
sm_cvar sv_minrate 100000
sm_cvar sv_maxrate 100000
sm_cvar sv_minupdaterate 100
sm_cvar sv_maxupdaterate 100
sm_cvar sv_mincmdrate 100
sm_cvar sv_maxcmdrate 100
sm_cvar sv_client_min_interp_ratio -1
sm_cvar sv_client_max_interp_ratio 0
sm_cvar nb_update_frequency 0.014
sm_cvar net_splitpacket_maxrate 50000
sm_cvar fps_max 0
sm_cvar tick_door_speed 1.3

// ---------------------------------------------------------------------
// [Misc tweaks]
// ---------------------------------------------------------------------
sm_cvar mp_autoteambalance 0
sm_cvar sv_unlag_fixstuck 1
sm_cvar z_brawl_chance 0
sm_cvar sv_maxunlag 1
sm_cvar sv_forcepreload 1
sm_cvar sv_client_predict 1
sm_cvar sv_client_cmdrate_difference 0
sm_cvar sv_max_queries_sec_global 10
sm_cvar sv_max_queries_sec 3
sm_cvar sv_max_queries_window 10
sm_cvar sv_player_stuck_tolerance 5
sm_cvar sv_stats 0
sm_cvar sv_clockcorrection_msecs 25

// =====================================================================
// PLUGIN LOADING — single source of truth
// =====================================================================
// Everything plugin-related lives in campaign.cfg. Do not add `sm
// plugins load` lines here; add them there.
exec campaign.cfg
