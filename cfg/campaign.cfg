// =====================================================================
// campaign.cfg — Bizzymod Campaign plugin load + cvar overrides
// =====================================================================
//
// Most plugins auto-load from plugins/ AND its subdirectories (except
// folders literally named 'disabled' and 'optional'). This file does
// the work that autoload can't:
//
//   * Loads plugins from plugins/optional/bizzymod/ (campaign-relevant
//     bizzymod plugins; 'optional' is in SM's auto-load exclusion list).
//   * Loads plugins from plugins/optional/ that we want (zonemod ships
//     a large optional/ tray; we cherry-pick).
//
// What we do NOT explicitly load here (because they auto-load already):
//   plugins/ root:   left4dhooks + base SourceMod admin/util plugins
//   plugins/fixes/:  ~50 engine + gameplay stability fixes
//   plugins/anticheat/: sbpp_*, lilac, l4d2_noghostcheat
//
// Matchmode plugins (confoglcompmod, match_vote) are server-side
// quarantined to plugins/disabled/ by the deploy workflow.
//
// HOW TO ADD A PLUGIN
//   - From plugins/ root or fixes/ or anticheat/: just drop the .smx; it
//     auto-loads. (Or rely on zonemod shipping it.)
//   - From optional/: add an 'sm plugins load optional/<name>.smx' line.
//   - To remove: comment / delete the load line, or move the .smx to
//     plugins/disabled/.
// =====================================================================

// ---------------------------------------------------------------------
// Zonemod optional/ plugins we explicitly enable
// ---------------------------------------------------------------------
sm plugins load optional/l4d2lib.smx
sm plugins load optional/predictable_unloader.smx
sm plugins load optional/playermanagement.smx
sm plugins load optional/l4d2_sound_manipulation.smx
sm plugins load optional/l4d2_tank_props_glow.smx
sm plugins load optional/nodeathcamskip.smx
sm plugins load optional/l4d2_map_transitions.smx

// ---------------------------------------------------------------------
// Bizzymod campaign plugins (this repo, plugins/optional/bizzymod/)
// ---------------------------------------------------------------------
// IMPORTANT context: plugins/bizzymod/ used to live at plugins/<name>/
// and auto-loaded EVERY .smx in it -- including matchmode-only plugins
// (bizzykits, l4d2_incapped_crawling, MeleeInTheSafeRoom, etc.) that
// produced the incap-crawl / melee-drop / temp-medkit / no-saferoom-guns
// / no-game-end-on-solo-death bug cluster. Moving the dir under
// plugins/optional/ stops auto-load. We re-enable only what's wanted.
sm plugins load optional/bizzymod/bizzymod_stats.smx
sm plugins load optional/bizzymod/l4d2scores.smx
sm plugins load optional/bizzymod/l4d2_mix.smx
sm plugins load optional/bizzymod/sm_RestartEmpty.smx
sm plugins load optional/bizzymod/Survivor_Legs.smx
sm plugins load optional/bizzymod/l4d2_spawn_props.smx
sm plugins load optional/bizzymod/l4d2-manual-director.smx
sm plugins load optional/bizzymod/l4d_weapon_spawn.smx
// ---------------------------------------------------------------------
// >4-survivor coop support — MultiSlots Improved stack
// ---------------------------------------------------------------------
// Replaced l4d_superversus (Merudo's Reloaded variant) with HarryPotter's
// MultiSlots Improved + companion fix plugins. SVR's eager pre-fill
// design produced the "3 Coaches in an empty server", character
// duplication, runaway director scaling, and the survivor-stuck-pinned
// bugs your testers hit. MultiSlots Improved is demand-driven (only
// spawns bots when human #5+ joins AND no idle bot to take over), and
// l4d_full_slot_bot_replace_fix is the missing companion that fixes
// the >4-slot takeover edge cases (charger stop, witch wrong target,
// character switching, weapons dropping on the ground).
//
// LOAD ORDER MATTERS:
//   1. l4d_CreateSurvivorBot — provides the CreateSurvivorBot() native
//      used by MultiSlots' SpawnFakeClient(). Must load first.
//   2. l4dmultislots — the survivor-cap manager itself.
//   3. l4d_full_slot_bot_replace_fix — the takeover-edge-case fixer.
//
// IMPORTANT — the srcds launch wrapper on the server needs
//   -maxplayers 31
// for HarryPotter's MultiSlots to allow more than 18 slots via
// l4dtoolz. Without it the server starts but the plugin logs a warning
// and stays at vanilla cap. See server1.cfg's MultiSlots block.
sm plugins load optional/bizzymod/l4d_CreateSurvivorBot.smx
sm plugins load optional/bizzymod/l4dmultislots.smx
sm plugins load optional/bizzymod/l4d_full_slot_bot_replace_fix.smx

// ---------------------------------------------------------------------
// Coop difficulty scaling — standalone replacement for SVR's scaling
// ---------------------------------------------------------------------
// See scripting/bizzymod_coop_scaling.sp for the full doc-comment. TL;DR:
// the //SuperVersus block in older-legacy/cfg/server1.cfg (lines 54-59)
// set director_tank_hpmulti / director_si_hpmulti / director_ci_multi /
// director_si_more — those four cvars were created and read by SVR's
// AutoDifficultyCheck() function. When we removed SVR in PR #6 the cvars
// stopped being read; scaling silently went away. This plugin re-
// implements ONLY that function (no bot management — MultiSlots owns
// slots). Same cvar names, same formula, same scaling envelope as
// older-legacy intended.
sm plugins load optional/bizzymod/bizzymod_coop_scaling.smx
sm plugins load optional/bizzymod/l4d_gear_transfer.smx
sm plugins load optional/bizzymod/l4d2_explosive_cars.smx
