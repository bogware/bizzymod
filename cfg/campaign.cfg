// =====================================================================
// campaign.cfg — Bizzymod Campaign single source of truth
// =====================================================================
//
// This is THE ONLY plugin-loading config exec'd by server1.cfg. Nothing
// else loads plugins — no matchmode framework, no confoglcompmod, no
// sm_matchmode invocations.
//
// HOW IT WORKS
// ------------
// SourceMod auto-loads any .smx sitting directly in
// `addons/sourcemod/plugins/`. We do NOT want autoload — it's how every
// Versus / matchmode plugin from the zonemod overlay was contaminating
// our Campaign server.
//
// The deploy workflow moves EVERY .smx from `plugins/` root into
// `plugins/disabled/` (which SourceMod ignores). This file then
// explicitly re-enables only the plugins a Campaign server actually
// needs, using the `disabled/<name>.smx` path.
//
// Plugins in subdirectories (bizzymod/, anticheat/, fixes/, optional/)
// do not auto-load either; they're loaded by explicit path below.
//
// HOW TO ADD A PLUGIN
// -------------------
// 1. Confirm the .smx is on the server somewhere under plugins/
//    (most live in disabled/, bizzymod/, anticheat/, fixes/, optional/).
// 2. Add ONE `sm plugins load <path>.smx` line below in the right section.
// 3. Push. Deploy will restart the server.
//
// HOW TO REMOVE A PLUGIN
// ----------------------
// Comment out or delete its `sm plugins load` line. Push. Done.
//
// DO NOT add `sm_matchmode`, `confogl_match_execcfg_plugins`, or any
// matchmode-loading mechanism here. Campaign only. Single mode. Forever.
// =====================================================================

