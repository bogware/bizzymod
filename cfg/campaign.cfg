// ---------------------------------------------------------------------
// Bizzymod campaign plugins (this repo, plugins/optional/bizzymod/)
// ---------------------------------------------------------------------
// IMPORTANT: SourceMod auto-recurses into every plugins/ subdir EXCEPT
// folders literally named "disabled" or "optional" (and their children).
// plugins/bizzymod/ used to be at the top level and EVERY .smx in it
// auto-loaded — including matchmode-only plugins (bizzykits,
// l4d2_incapped_crawling, MeleeInTheSafeRoom, tank_and_nowitch_ifier,
// l4d_notank, l4d_nowitch) — causing exactly the bug profile we chased
// for weeks (incap crawl, melee drop on saferoom, temp medkits, no
// saferoom guns, no game-end on solo death).
//
// FIX: moved the whole dir under plugins/optional/ so nothing
// auto-loads. We load only the campaign-relevant ones explicitly here.
// Matchmode .smx files were deleted from the repo entirely.
sm plugins load optional/bizzymod/l4d_stats.smx
sm plugins load optional/bizzymod/l4d2scores.smx
sm plugins load optional/bizzymod/l4d2_mix.smx
sm plugins load optional/bizzymod/sm_RestartEmpty.smx
sm plugins load optional/bizzymod/Survivor_Legs.smx
sm plugins load optional/bizzymod/l4d2_spawn_props.smx
sm plugins load optional/bizzymod/l4d2-manual-director.smx
sm plugins load optional/bizzymod/l4d_weapon_spawn.smx
