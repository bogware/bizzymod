// =====================================================================
// autoexec.cfg -- executed at server startup BEFORE the first map loads.
// =====================================================================
// Public-visibility / matchmaking cvars live here (not only in server1.cfg)
// because srcds execs server1.cfg AFTER the first map is loaded, and several
// of these must be set before the server registers with Steam matchmaking to
// take effect. (AlliedModders L4D2 public-server threads, 2024-2026.)
// =====================================================================
sv_lan 0
sv_region 255                       // 255 = worldwide (shows in every region filter)
sv_steamgroup "38693222"            // Bizzymod group -> also lists under Group -> Servers
sv_steamgroup_exclusive 0           // public can join (not group-exclusive)
sv_search_key ""                    // no search-key filter -> any lobby can force/find us

// sv_allow_lobby_connect_only 1 ENABLES public matchmaking (Quick Match /
// Play Online / the "Creating Game" flow). Counterintuitively, 0 EXCLUDES the
// server from public lobby matchmaking (recent AlliedModders consensus, 2026).
// Direct / IP / server-browser / Steam-group joins still work with 1, so the
// 5-16 direct-join for +4 is unaffected.
sv_allow_lobby_connect_only 1
sv_visiblemaxplayers -1
