"Databases"
{
	"driver_default"		"mysql"
	
	// When specifying "host", you may use an IP address, a hostname, or a socket file path

	"sourcebans"
	{
		"driver"			"default"
		"host"				"#{SourceBans_DB_IP}#"
		"database"			"#{SourceBans_DB}#"
		"user"				"#{SourceBans_User}#"
		"pass"				"#{SourceBans_Pass}#"
		//"timeout"			"0"
		"port"				"#{SourceBans_Port}#"
	}

	"l4dstats"
	{
		"driver"			"mysql"
		"host"				"#{l4dstats_DB_IP}#"
		"database"			"#{l4dstats_DB}#"
		"user"				"#{l4dstats_User}#"
		"pass"				"#{l4dstats_Pass}#"
		//"timeout"			"0"
		"port"				"#{l4dstats_Port}#"
	}

	// bizzymod-stats plugin (https://github.com/bogware/bizzymod-stats).
	// Reuses the same MySQL host as l4dstats by default but writes to a
	// separate database (its own 60+ table schema, applied by the
	// schema/scripts/migrate.py runner). Token names match the new
	// BIZZYMOD_STATS_* GitHub Vars/Secrets — see DEPLOY.md.
	"bizzymod_stats"
	{
		"driver"			"mysql"
		"host"				"#{BizzymodStats_DB_IP}#"
		"database"			"#{BizzymodStats_DB}#"
		"user"				"#{BizzymodStats_User}#"
		"pass"				"#{BizzymodStats_Pass}#"
		"port"				"#{BizzymodStats_Port}#"
		"timeout"			"30"
	}
	
	"default"
	{
		"driver"			"default"
		"host"				"localhost"
		"database"			"sourcemod"
		"user"				"root"
		"pass"				""
		//"timeout"			"0"
		//"port"			"0"
	}
	
	"storage-local"
	{
		"driver"			"sqlite"
		"database"			"sourcemod-local"
	}

	"clientprefs"
	{
		"driver"			"sqlite"
		"host"				"localhost"
		"database"			"clientprefs-sqlite"
		"user"				"root"
		"pass"				""
		//"timeout"			"0"
		//"port"			"0"
	}
}

