// bizzyload.cfg — bizzymod ALWAYS-ON plugins, loaded in the UNLOCKED window.
//
// confoglcompmod runs `sm plugins unload_all` at match start, then execs the
// confogl_match_execcfg_plugins chain (set in server1.cfg). zonemod's confoglcompmod
// engages its plugin load-lock as soon as it loads inside confogl_plugins.cfg — EARLIER
// than the legacy "rework" confoglcompmod did. So the operator's always-on set must load
// here (chain position: after generalfixes.cfg provides left4dhooks + l4d2lib, but BEFORE
// confogl_plugins.cfg locks) instead of in sharedplugins.cfg, or it fails with
// "global plugin loading lock in effect" and stats/anticheat drop mid-session.
//
// Stock SourceMod deps our always-on plugins need DURING the match chain.
// After `sm plugins unload_all` these stock plugins are gone and confoglcompmod
// only refreshes them AFTER the lock engages; load them here (unlocked window)
// so bizzymod_stats' admin menu and sbpp_comms' basecomm dependency resolve.
// (Idempotent: "already loaded" at other times is harmless.)
sm plugins load adminmenu.smx
sm plugins load basecomm.smx
// Stats + team tooling
sm plugins load bizzymod/bizzymod_stats.smx
// Force-precache props that otherwise late-precache mid-round (removes the ~5s
// laggy hitches early in a chapter as survivors reach un-precached anniversary/
// rework props). Model list: configs/bizzymod_precache.txt.
sm plugins load bizzymod/l4d2_force_precache.smx
sm plugins load bizzymod/l4d2scores.smx
sm plugins load bizzymod/l4d2_mix.smx
sm plugins load bizzymod/sm_RestartEmpty.smx
// NOTE: do NOT load optional/bizzymod/tank_and_nowitch_ifier.smx here. Despite the
// old "1 tank + 1 witch" label, that plugin REMOVES the witch spawn on every map
// ("Tank and no Witch ifier"), which forced Witch: None fleet-wide and overrode the
// mode's own boss config. bizzymod wants 1 tank + 1 witch — the mode chain already
// loads optional/witch_and_tankifier.smx (cfgogl/<mode>/confogl_plugins.cfg), exactly
// as the legacy Playhouse does. Let that handle the boss spawns.
// Anti-Cheat (SourceBans++ + lilac + noghostcheat)
sm plugins load anticheat/sbpp_admcfg.smx
sm plugins load anticheat/sbpp_checker.smx
sm plugins load anticheat/sbpp_comms.smx
sm plugins load anticheat/sbpp_main.smx
sm plugins load anticheat/sbpp_report.smx
sm plugins load anticheat/sbpp_sleuth.smx
sm plugins load anticheat/lilac.smx
sm plugins load anticheat/l4d2_noghostcheat.smx
