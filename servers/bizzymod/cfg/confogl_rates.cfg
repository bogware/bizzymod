// confogl_rates.cfg — per-match network rates, exec'd by every cfgogl mode's
// shared_cvars.cfg ("exec confogl_rates.cfg"). Without this file each match load
// logged "couldn't exec confogl_rates.cfg" and the per-match rate overrides never
// applied. Values mirror server1.cfg's 100-tick Rates section — keep them in sync
// (change proportionally if the tickrate ever changes).
sv_minrate            100000
sv_maxrate            100000
sv_minupdaterate      100
sv_maxupdaterate      100
sv_mincmdrate         100
sv_maxcmdrate         100
net_splitpacket_maxrate 50000
net_maxcleartime      0.0001
