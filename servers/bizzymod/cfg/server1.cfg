// =======================================================================================
// Bizzy's Dugout — bizzymod realism-versus competitive server (server1.cfg)
// Primary server.cfg, exec'd at startup via +servercfgfile server1.cfg.
//
// This server runs the FULL confoglcompmod matchmode system (zonemod v1.0.0 base +
// the bizzymod-family config library overlaid). Any player can `!match` to vote a
// mode; ~50 configs are selectable (zonemod, numbersmod, barrymod, bizzymod, ...).
// Default mode: numbersmod (see the Matchmode section below).
// =======================================================================================

// [General / Identity]
// -----------------------------------------------------------------------
hostname "#{Server_Name}#"                       // token-replaced at deploy (e.g. "Bizzy's Dugout")
rcon_password "#{RCON_Pass}#"                     // token-replaced at deploy
sv_steamgroup "38693222"                          // bizzymod Steam group (shared with campaign/flatshole)
sv_steamgroup_exclusive "0"                        // 0 = public can always join
sv_search_key "bizzymod"                           // THE bizzymod matchmaking key (campaign moved to "bizzymod-campaign")

motdfile "mymotd.txt"
hostfile "myhost.txt"

// What .cfg files confoglcompmod execs on matchmode load (plugins only; ; separated).
// confoglcompmod runs `sm plugins unload_all` first, so these re-load the plugin set.
// bizzyload.cfg holds our always-on set (stats + anticheat); it MUST come after
// generalfixes.cfg (left4dhooks/l4d2lib) but BEFORE confogl_plugins.cfg engages the
// plugin load-lock (see bizzyload.cfg for why).
sm_cvar confogl_match_execcfg_plugins "generalfixes.cfg;bizzyload.cfg;confogl_plugins.cfg;sharedplugins.cfg"

// [Other Neat Stuff]
// -----------------------------------------------------------------------
sv_allow_lobby_connect_only "0"

// [File Consistency]
// -----------------------------------------------------------------------
sv_consistency "1"
sv_pure "2"
sv_pure_kick_clients "1"

// [Logging]
// -----------------------------------------------------------------------
log on
sv_logecho 0
sv_logfile 1
sv_log_onefile 1
sv_logbans 1
sv_logflush 1
sv_logsdir logs

// [Addon Disabler] 0 = disable client addons (keeps the ruleset canonical)
sm_cvar l4d2_addons_eclipse 0
sm_cvar sv_allow_wait_command 0

// [Networking, Rates] — 100-tick. Change proportionally if tickrate changes.
// -----------------------------------------------------------------------
sm_cvar sv_minrate 100000
sm_cvar sv_maxrate 100000
sm_cvar sv_minupdaterate 100
sm_cvar sv_maxupdaterate 100
sm_cvar sv_mincmdrate 100
sm_cvar sv_maxcmdrate 100
sm_cvar sv_client_min_interp_ratio -1
sm_cvar sv_client_max_interp_ratio 0
sm_cvar nb_update_frequency 0.014
sm_cvar net_splitpacket_maxrate 50000
sm_cvar net_maxcleartime 0.0001
sm_cvar fps_max 0
sm_cvar tick_door_speed 1.3

// Slots. On this box's server.so, L4DToolZ's mv_maxplayers is a no-op (it loads and
// registers the cvar but its slot-limit patch doesn't apply), so the visible slot
// count comes from the stock sv_maxplayers cvar — exactly how campaign gets 16. Set it
// to 30 to match Bizzy's Playhouse (dev). server1.cfg re-execs each map, which re-applies
// it (the job mv_maxplayers would otherwise do). mv_maxplayers stays as belt-and-suspenders.
sm_cvar sv_maxplayers 30
sm_cvar mv_maxplayers 30

// Some tweaking
sm_cvar mp_autoteambalance 0
sm_cvar sv_unlag_fixstuck 1
sm_cvar z_brawl_chance 0
sm_cvar sv_maxunlag 1
sm_cvar sv_forcepreload 1
sm_cvar sv_client_predict 1
sm_cvar sv_client_cmdrate_difference 0
sm_cvar sv_max_queries_sec_global 10
sm_cvar sv_max_queries_sec 3
sm_cvar sv_max_queries_window 10
sm_cvar sv_player_stuck_tolerance 5
sm_cvar sv_stats 0
sm_cvar sv_clockcorrection_msecs 25

// [Boot-time bizzymod plugins]
// -----------------------------------------------------------------------
// bizzymod_stats lives in plugins/bizzymod/ and AUTO-LOADS, so it is up for idle /
// casual play with no boot command needed here. During a confoglcompmod match the
// initial `sm plugins unload_all` drops every auto-loaded plugin and only the
// explicit match-plugin lists reload a subset — so bizzyload.cfg re-loads the
// bizzymod always-on set (stats + anticheat + mix) in the unlocked window. We do
// NOT load it here on purpose: server1.cfg re-execs on every map change, and a
// boot-load would hit "loading lock in effect" on a mid-match changelevel.

// [Matchmode default]
// -----------------------------------------------------------------------
// Players vote modes with `!match`. To boot straight into numbersmod (most-played),
// confoglcompmod's default is set here. VERIFY/adjust live on first standup:
//   sm_forcematch numbersmod    (admin command; confirm cvar/command name in-game)
// Leave commented to boot idle (vanilla versus until a mode is voted).
//sm_forcematch numbersmod
