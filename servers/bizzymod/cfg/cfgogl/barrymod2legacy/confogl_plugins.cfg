//-------------------------------------------
// shared plugins
//-------------------------------------------
exec cfgogl/barrymod2legacy/shared_plugins.cfg

//-------------------------------------------
// barrymod2 4v4
//-------------------------------------------
sm plugins load optional/l4d2_playstats.smx
sm plugins load optional/l4d2_skill_detect.smx
sm plugins load optional/witch_and_tankifier.smx
sm plugins load optional/l4d2_slowdown_control.smx
sm plugins load optional/l4d_tank_painfade.smx
sm plugins load optional/l4d2_reload_fix.smx
sm plugins load optional/l4d_witch_damage_announce.smx
sm plugins load optional/survivor_mvp.smx
sm plugins load optional/autopause.smx

sm plugins load bizzymod/bizzykits.smx
sm plugins load bizzymod/SpecListener.smx
sm plugins load bizzymod/vscript_replacer.smx
sm plugins load bizzymod/l4d_heal_revive_fix.smx
sm plugins load bizzymod/l4d_gear_transfer.smx

//-------------------------------------------
// barrymod2 refinements (independent of barrymod)
//-------------------------------------------
// [#5] witch incaps instead of instakilling a survivor in her path
sm plugins load bizzymod/l4d_witch_damage.smx

// [#9] smarter/more effective AI tank (smart_ai_rock + profitless already loaded via shared_plugins)
sm plugins load optional/l4d2_tank_melee_fury.smx
sm plugins load optional/l4d2_tankrage.smx

// custom barrymod2-only plugins (built by .deploy/build-plugins.sh from scripting/*.sp)
sm plugins load optional/bizzymod/bm2_no_finale_witch.smx              // [#4] no witch on finale maps
sm plugins load optional/bizzymod/bm2_witch_flow_floor.smx             // [#18] witch spawn flow floored >50%
sm plugins load optional/bizzymod/barrymod2_si_respawn_health.smx      // [#2] SI fractional respawn HP
sm plugins load optional/bizzymod/barrymod2_si_class_swap.smx          // [#3] boomer/spitter swap during tank
sm plugins load optional/bizzymod/barrymod2_hunter_fastpounce_nodeadstop.smx  // [#13] fast pounce can't be dead-stopped
sm plugins load optional/bizzymod/barrymod2_block_saferoom_spawn.smx   // [#14] no SI materialize through closed end-saferoom door
sm plugins load optional/bizzymod/l4d2_b2_afkdrug.smx                  // [#6] drug AFK survivors during ready-up
sm plugins load optional/bizzymod/l4d2_b2_pause_defer.smx              // [#15] defer !pause while healing / getting up
sm plugins load optional/bizzymod/l4d2_b2_trade.smx                    // [#16] !trade hands your item to a facing teammate

// [#1] EXPERIMENTAL witch-saferoom-follow nav assist — leave DISABLED until a live repro test.
