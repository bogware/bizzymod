// =====================================================================
// server1.cfg -- Flat's Hole (vanilla VERSUS)
// =====================================================================
// Exec'd by srcds at startup. Sets identity + cvars, then hands plugin
// loading to ONE file: flatshole.cfg.
//
// Flat's Hole is a PUBLIC VANILLA VERSUS server: valve gameplay is left
// untouched. We keep ONLY stability/bug/crash fixes + admin + SourceBans
// + stats. No matchmode, no gameplay plugins, no team shuffling, no
// +survivor / SuperVersus / director scaling.
// =====================================================================

// ---------------------------------------------------------------------
// [Identity]
// ---------------------------------------------------------------------
hostname "#{Server_Name}#"
rcon_password "#{RCON_Pass}#"

sv_steamgroup "38693222"            // bizzymod Steam group (shared with campaign)
sv_steamgroup_exclusive "0"         // 0 = public can always join
sv_search_key "flatshole"           // distinct key (NOT campaign's "bizzymod")
sv_lan "0"                          // public -- Steam master-server heartbeat
sv_region "255"                     // worldwide
sv_tags "versus,vanilla,bizzymod"   // community-browser filter tags

motdfile "mymotd.txt"
hostfile "myhost.txt"

// ---------------------------------------------------------------------
// [Gamemode -- VERSUS]
// ---------------------------------------------------------------------
// Dedicated versus server: pin versus so it always runs versus. (Also set
// in autoexec.cfg, which execs BEFORE the boot map, so the first map loads
// straight into versus.)
mp_gamemode versus
sm_cvar mp_gamemode versus

// ---------------------------------------------------------------------
// [Vanilla gameplay -- untouched]
// ---------------------------------------------------------------------
// No difficulty pin (versus has its own), no survivor-slot opening, no
// l4dtoolz +survivors, no SuperVersus, no director scaling. Standard 4v4.
mp_autoteambalance 0                // never auto-shuffle teams (strict vanilla)
sm_cvar mp_autoteambalance 0

// ---------------------------------------------------------------------
// [Lobby / join behavior]
// ---------------------------------------------------------------------
// Accept direct/browser AND lobby joins. force_unreserved MUST stay 0
// (1 permanently wipes the lobby reservation and breaks lobby joins).
sv_allow_lobby_connect_only "0"
sm_cvar sv_allow_lobby_connect_only "0"
sv_force_unreserved "0"
sm_cvar sv_force_unreserved "0"

// ---------------------------------------------------------------------
// [File consistency / addon control -- open]
// ---------------------------------------------------------------------
sv_consistency "0"
sv_pure "0"
sv_pure_kick_clients "0"
sm_cvar l4d2_addons_eclipse 1

// ---------------------------------------------------------------------
// [Logging]
// ---------------------------------------------------------------------
log on
sv_logecho 0
sv_logfile 1
sv_log_onefile 1
sv_logbans 1
sv_logflush 1
sv_logsdir logs

// ---------------------------------------------------------------------
// [Wait commands disabled]
// ---------------------------------------------------------------------
sm_cvar sv_allow_wait_command 0

// ---------------------------------------------------------------------
// [Networking -- 100 tick]
//   rate/splitpacket = tickrate*1000 ; cmdrate/updaterate = tickrate
// ---------------------------------------------------------------------
sm_cvar sv_minrate 100000
sm_cvar sv_maxrate 100000
sm_cvar sv_minupdaterate 100
sm_cvar sv_maxupdaterate 100
sm_cvar sv_mincmdrate 100
sm_cvar sv_maxcmdrate 100
sm_cvar sv_client_min_interp_ratio -1
sm_cvar sv_client_max_interp_ratio 0
sm_cvar nb_update_frequency 0.014
sm_cvar net_splitpacket_maxrate 50000
sm_cvar fps_max 0
sm_cvar tick_door_speed 1.3

// ---------------------------------------------------------------------
// [Misc tweaks]
// ---------------------------------------------------------------------
sm_cvar sv_unlag_fixstuck 1
sm_cvar sv_maxunlag 1
sm_cvar sv_forcepreload 1
sm_cvar sv_client_predict 1
sm_cvar sv_client_cmdrate_difference 0
sm_cvar sv_max_queries_sec_global 10
sm_cvar sv_max_queries_sec 3
sm_cvar sv_max_queries_window 10
sm_cvar sv_player_stuck_tolerance 5
sm_cvar sv_stats 0
sm_cvar sv_clockcorrection_msecs 25

// =====================================================================
// PLUGIN LOADING -- single source of truth (flatshole.cfg)
// =====================================================================
exec flatshole.cfg
