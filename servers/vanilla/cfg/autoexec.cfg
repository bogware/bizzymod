// =====================================================================
// autoexec.cfg -- Flat's Hole, executed at startup BEFORE the first map.
// =====================================================================
// Public-visibility + gamemode cvars go here because srcds execs server1.cfg
// AFTER the first map loads, and these must be set before the boot map /
// Steam matchmaking registration to take effect.
// =====================================================================
mp_gamemode versus                  // dedicated VERSUS server. NOTE: this cfg line does NOT
                                    // change the BOOT map's gamemode (it comes up coop/4-slot
                                    // until the first map change) -- the launch MUST also pass
                                    // +mp_gamemode versus (GAMEMODE=versus in srcds-launch.sh /
                                    // the init script). This line keeps versus sticky afterward.
sv_lan 0
sv_region 255                       // 255 = worldwide (every region filter)
sv_steamgroup "38693222"            // Bizzymod group (shared with campaign)
sv_steamgroup_exclusive 0           // public can join (not group-exclusive)
sv_search_key "flatshole"           // distinct key (NOT campaign's "bizzymod")
sv_allow_lobby_connect_only 0       // accept BOTH direct and lobby joins
