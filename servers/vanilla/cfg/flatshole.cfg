// =====================================================================
// flatshole.cfg -- Flat's Hole plugin loading (vanilla VERSUS)
// =====================================================================
// The SINGLE source of truth for what loads. Flat's Hole is vanilla, so
// this file loads ONLY the stats plugin + an empty-server restart utility.
// Everything else that runs is auto-loaded and intentional:
//   plugins/ root:      left4dhooks + base SourceMod admin/util plugins
//   plugins/fixes/:     zonemod stability/bug/crash fixes -- MINUS the
//                       gameplay-changing ones, which the deploy quarantines
//                       to plugins/disabled/ (servers/vanilla/deploy.env,
//                       QUARANTINE_FIXES).
//   plugins/anticheat/: sbpp_*, lilac, l4d2_noghostcheat
//
// NOT loaded (deliberately): every bizzymod gameplay plugin (manual director,
// spawn props, weapon spawn, SuperVersus, gear transfer, explosive cars, mix,
// l4d2scores, Survivor_Legs). Flat's Hole changes NO core gameplay.
// =====================================================================

// l4d2lib is a shared library several fixes/ plugins require -- load it first.
sm plugins load optional/l4d2lib.smx

// Stats (shared bizzymod-stats DB) + empty-server restart utility.
sm plugins load optional/bizzymod/bizzymod_stats.smx
sm plugins load optional/bizzymod/sm_RestartEmpty.smx

// ---------------------------------------------------------------------
// FINAL assertion -- last word after any zonemod server.cfg exec.
// ---------------------------------------------------------------------
mp_gamemode versus
sv_allow_lobby_connect_only 0
sv_search_key "flatshole"
