// bizzymod-stats — server-side cvar overrides (auto-exec'd by SourceMod
// when the plugin loads, since the plugin uses AutoExecConfig).
//
// SILENT MODE: stat collection and award awarding still happen; players
// only see stats when they explicitly type !rank / !top10 / !nextrank / etc.
// No join announcement, no rank-change announcement, no event firehose.

bizzymod_stats_enabled                  "1"     // master on/off; 1 = collect + award
bizzymod_stats_announce_join            "0"     // SILENT: do NOT print "<player> (rank X) joined" on connect
bizzymod_stats_announce_rank            "0"     // SILENT: do NOT print "<player> promoted to rank X" on level-up
bizzymod_stats_log_events               "0"     // do NOT write the award_events firehose table (off by default; explicit for clarity)

// Friendly fire — keep at sensible defaults (cooldown mode, 10s window).
bizzymod_stats_ffire_mode               "1"
bizzymod_stats_ffire_multiplier         "1.5"
bizzymod_stats_ffire_cooldown           "10.0"

// Difficulty scaling on score + allow point loss for griefing (defaults).
bizzymod_stats_difficulty_multiplier    "1"
bizzymod_stats_negative_score           "1"

// Bot interaction multiplier (1.0 = normal; 0 disables bot-related penalties).
bizzymod_stats_bot_multiplier           "1.0"
