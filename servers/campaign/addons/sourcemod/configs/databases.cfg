"Databases"
{
	"driver_default"		"mysql"
	
	// When specifying "host", you may use an IP address, a hostname, or a socket file path

	"sourcebans"
	{
		"driver"			"default"
		"host"				"#{SourceBans_DB_IP}#"
		"database"			"#{SourceBans_DB}#"
		"user"				"#{SourceBans_User}#"
		"pass"				"#{SourceBans_Pass}#"
		//"timeout"			"0"
		"port"				"#{SourceBans_Port}#"
	}

	// bizzymod-stats plugin (https://github.com/bogware/bizzymod-stats).
	// Reuses the L4DSTATS_* credentials (same MySQL host + user + pass)
	// but writes to a separate database named "bizzymod_stats". The
	// existing user needs GRANT ALL on bizzymod_stats.* (one-time SQL):
	//
	//   CREATE DATABASE bizzymod_stats CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
	//   GRANT ALL ON bizzymod_stats.* TO 'YOUR_L4DSTATS_USER'@'%';
	//   FLUSH PRIVILEGES;
	//
	// Schema applied + legacy data imported by .github/workflows/migrate-stats.yml.
	"bizzymod_stats"
	{
		"driver"			"mysql"
		"host"				"#{l4dstats_DB_IP}#"
		"database"			"bizzymod_stats"
		"user"				"#{l4dstats_User}#"
		"pass"				"#{l4dstats_Pass}#"
		"port"				"#{l4dstats_Port}#"
		"timeout"			"30"
	}
	
	"default"
	{
		"driver"			"default"
		"host"				"localhost"
		"database"			"sourcemod"
		"user"				"root"
		"pass"				""
		//"timeout"			"0"
		//"port"			"0"
	}
	
	"storage-local"
	{
		"driver"			"sqlite"
		"database"			"sourcemod-local"
	}

	"clientprefs"
	{
		"driver"			"sqlite"
		"host"				"localhost"
		"database"			"clientprefs-sqlite"
		"user"				"root"
		"pass"				""
		//"timeout"			"0"
		//"port"			"0"
	}
}

