// bizzyload.cfg -- Bizzy's ZoneMod ALWAYS-ON essentials (stats + anticheat).
//
// Loaded in the UNLOCKED window of zonemod's match chain. confoglcompmod runs
// `sm plugins unload_all` at match start, then execs the confogl_match_execcfg_plugins
// chain set in server1.cfg. zonemod's confoglcompmod engages its plugin load-lock as
// soon as it loads inside confogl_plugins.cfg, so our always-on set must load HERE
// (chain position: after generalfixes.cfg provides left4dhooks + l4d2lib, but BEFORE
// confogl_plugins.cfg locks) -- otherwise it fails with "global plugin loading lock in
// effect" and stats/anticheat drop mid-session. (Idempotent: "already loaded" at other
// times is harmless.)
//
// This is the ONLY Bizzymod divergence from stock zonemod: we add stats + bans +
// anticheat and nothing else. The matchmode, fixes, and config library are all stock.

// Stock SourceMod deps our essentials need during the match chain (gone after
// unload_all; confoglcompmod only refreshes them after the lock engages):
sm plugins load adminmenu.smx
sm plugins load basecomm.smx

// Stats
sm plugins load optional/bizzymod/bizzymod_stats.smx

// Anti-cheat (SourceBans++ + lilac + noghostcheat)
sm plugins load anticheat/sbpp_admcfg.smx
sm plugins load anticheat/sbpp_checker.smx
sm plugins load anticheat/sbpp_comms.smx
sm plugins load anticheat/sbpp_main.smx
sm plugins load anticheat/sbpp_report.smx
sm plugins load anticheat/sbpp_sleuth.smx
sm plugins load anticheat/lilac.smx
sm plugins load anticheat/l4d2_noghostcheat.smx
