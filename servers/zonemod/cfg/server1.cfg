// =======================================================================================
// Bizzy's ZoneMod -- stock (latest) zonemod + Bizzymod essentials (server1.cfg)
// Primary server.cfg, exec'd at startup via +servercfgfile server1.cfg.
//
// This is STOCK SirPlease zonemod at its latest master (see deploy.env ZONEMOD_REF),
// with only the thin Bizzymod layer added: bizzymod_stats, lilac, SourceBans++, and
// our admins. The FULL confoglcompmod matchmode runs -- any player can `!match` to
// vote among zonemod's own config library (zonemod, zonemodX, EQ, Promod, ...).
// We add NO bizzymod config library here (that's Bizzy's Dugout); this stays stock.
// =======================================================================================

// [General / Identity]
// -----------------------------------------------------------------------
hostname "#{Server_Name}#"                       // token-replaced at deploy (e.g. "Bizzy's ZoneMod")
rcon_password "#{RCON_Pass}#"                     // token-replaced at deploy
sv_steamgroup "38693222"                          // bizzymod Steam group (shared across the fleet)
sv_steamgroup_exclusive "0"                        // 0 = public can always join
sv_search_key "zonemod"                            // distinct matchmaking key for this server
sv_tags "zonemod,versus,competitive,bizzymod"      // community-browser filter tags

motdfile "mymotd.txt"
hostfile "myhost.txt"

// What .cfg files confoglcompmod execs on matchmode load (plugins only; ; separated).
// confoglcompmod runs `sm plugins unload_all` first, so these re-load the plugin set.
// bizzyload.cfg holds our always-on essentials (stats + anticheat); it MUST come after
// generalfixes.cfg (left4dhooks/l4d2lib) but BEFORE confogl_plugins.cfg engages the
// plugin load-lock (see bizzyload.cfg for why).
sm_cvar confogl_match_execcfg_plugins "generalfixes.cfg;bizzyload.cfg;confogl_plugins.cfg;sharedplugins.cfg"

// [Lobby / join behavior]
// -----------------------------------------------------------------------
sv_allow_lobby_connect_only "0"

// [File Consistency] -- canonical competitive ruleset (same as zonemod intends)
// -----------------------------------------------------------------------
sv_consistency "1"
sv_pure "2"
sv_pure_kick_clients "1"

// [Logging]
// -----------------------------------------------------------------------
log on
sv_logecho 0
sv_logfile 1
sv_log_onefile 1
sv_logbans 1
sv_logflush 1
sv_logsdir logs

// [Addon Disabler] 0 = disable client addons (keeps the ruleset canonical)
sm_cvar l4d2_addons_eclipse 0
sm_cvar sv_allow_wait_command 0

// [Networking, Rates] -- 100-tick. Change proportionally if tickrate changes.
// -----------------------------------------------------------------------
sm_cvar sv_minrate 100000
sm_cvar sv_maxrate 100000
sm_cvar sv_minupdaterate 100
sm_cvar sv_maxupdaterate 100
sm_cvar sv_mincmdrate 100
sm_cvar sv_maxcmdrate 100
sm_cvar sv_client_min_interp_ratio -1
sm_cvar sv_client_max_interp_ratio 0
sm_cvar nb_update_frequency 0.014
sm_cvar net_splitpacket_maxrate 50000
sm_cvar net_maxcleartime 0.0001
sm_cvar fps_max 0
sm_cvar tick_door_speed 1.3

// Slots. Allow full 4v4 + spectators / casual play.
sm_cvar sv_maxplayers 30
sm_cvar mv_maxplayers 30

// Some tweaking
sm_cvar mp_autoteambalance 0
sm_cvar sv_unlag_fixstuck 1
sm_cvar z_brawl_chance 0
sm_cvar sv_maxunlag 1
sm_cvar sv_forcepreload 1
sm_cvar sv_client_predict 1
sm_cvar sv_client_cmdrate_difference 0
sm_cvar sv_max_queries_sec_global 10
sm_cvar sv_max_queries_sec 3
sm_cvar sv_max_queries_window 10
sm_cvar sv_player_stuck_tolerance 5
sm_cvar sv_stats 0
sm_cvar sv_clockcorrection_msecs 25

// [Boot-time essentials]
// -----------------------------------------------------------------------
// bizzymod_stats auto-loads for idle/casual play (it lives in plugins/optional/
// bizzymod/ and is re-loaded by bizzyload.cfg inside the match chain). We do NOT
// load it here: server1.cfg re-execs on every map change, and a boot-load would
// hit "loading lock in effect" on a mid-match changelevel -- bizzyload.cfg handles
// it in the unlocked window instead.

// [Matchmode default]
// -----------------------------------------------------------------------
// Players vote modes with `!match`. Leave commented to boot idle (vanilla versus
// until a mode is voted); set a default here if you want one on first standup:
//sm_forcematch zonemod
