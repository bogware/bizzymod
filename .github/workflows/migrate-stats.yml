name: Migrate stats DB

# Manual-trigger workflow that ports legacy l4d_stats data into the new
# bizzymod_stats schema. Runs from the GAME SERVER (via SSH) because the
# MySQL host has IP allowlisting and the GH Actions runner IPs aren't on it
# — but the game server already has working DB connectivity.
#
# Steps (all idempotent + safe to re-run):
#   1. rsync migration files into /tmp on the game server
#   2. (via SSH) install Python3 + mysql-connector-python
#   3. (via SSH) ensure `bizzymod_stats` database exists
#   4. (via SSH) apply schema migrations via the vendored migrate.py
#   5. (via SSH) import legacy data via migrate-legacy-stats.py
#
# Credentials are reused from the existing L4DSTATS_* + SSH_* vars/secrets.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: count rows we would write but don't actually write"
        type: boolean
        default: true
      skip_schema_migrate:
        description: "Skip running schema migrate.py (use if schema is already applied)"
        type: boolean
        default: false
      skip_legacy_import:
        description: "Skip importing legacy l4d_stats data (schema-only run)"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Install sshpass + rsync
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends sshpass rsync openssh-client

      - name: Trust SSH host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Run migration on the game server
        env:
          SSHPASS:        ${{ secrets.SSH_PASSWORD }}
          SUDO_PASS:      ${{ secrets.SUDO_PASSWORD }}
          SSH_HOST:       ${{ secrets.SSH_HOST }}
          SSH_USER:       ${{ vars.SSH_USER }}
          SSH_PORT:       ${{ vars.SSH_PORT || '22' }}
          MYSQL_HOST:     ${{ vars.L4DSTATS_DB_IP }}
          MYSQL_PORT:     ${{ vars.L4DSTATS_PORT }}
          MYSQL_USER:     ${{ vars.L4DSTATS_USER }}
          MYSQL_PASS:     ${{ secrets.L4DSTATS_PASS }}
          LEGACY_DB:      ${{ vars.L4DSTATS_DB }}
          DRY_RUN:        ${{ inputs.dry_run }}
          SKIP_SCHEMA:    ${{ inputs.skip_schema_migrate }}
          SKIP_IMPORT:    ${{ inputs.skip_legacy_import }}
        run: |
          set -euo pipefail

          REMOTE_DIR="/tmp/bizzymod-stats-migrate.$$"
          DRY_RUN_FLAG=""
          if [[ "${DRY_RUN}" == "true" ]]; then DRY_RUN_FLAG="--dry-run"; fi

          # Helper for sudo-required commands (uses fed-via-stdin sudo password).
          remote() {
              SSHPASS="${SSHPASS}" sshpass -e ssh -o StrictHostKeyChecking=yes \
                  -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
                  "sudo -S -p '' bash -lc \"$1\"" <<< "${SUDO_PASS}"
          }
          plain_remote() {
              SSHPASS="${SSHPASS}" sshpass -e ssh -o StrictHostKeyChecking=yes \
                  -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "$1"
          }

          echo "::group::Rsync migration files to game server"
          SSHPASS="${SSHPASS}" rsync -az --delete \
              -e "sshpass -e ssh -o StrictHostKeyChecking=yes -p ${SSH_PORT}" \
              .deploy/migrate-legacy-stats.py \
              .deploy/bizzymod_stats_schema/ \
              "${SSH_USER}@${SSH_HOST}:${REMOTE_DIR}/"
          echo "::endgroup::"

          echo "::group::Install Python + MySQL libraries on game server"
          # migrate.py needs pymysql; migrate-legacy-stats.py needs mysql-connector-python.
          remote "
              command -v python3 >/dev/null || apt-get install -y python3
              command -v pip3 >/dev/null || apt-get install -y python3-pip
              # Ubuntu 24 (PEP 668) needs --break-system-packages for global pip.
              pip3 install --break-system-packages 'pymysql>=1.1.0' 'mysql-connector-python>=8.0' 2>/dev/null \
                  || pip3 install 'pymysql>=1.1.0' 'mysql-connector-python>=8.0'
              python3 --version
          "
          echo "::endgroup::"

          echo "::group::Bootstrap — ensure bizzymod_stats DB exists"
          # mysql-client should already be available on the game server (or
          # we can use python to test). Use Python instead — guaranteed to work.
          plain_remote "
              python3 - <<'PY'
          import mysql.connector
          conn = mysql.connector.connect(
              host='${MYSQL_HOST}', port=${MYSQL_PORT},
              user='${MYSQL_USER}', password='''${MYSQL_PASS}''',
          )
          cur = conn.cursor()
          try:
              cur.execute(\"CREATE DATABASE IF NOT EXISTS bizzymod_stats \"
                          \"CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci\")
              print('OK: bizzymod_stats database ready')
          except mysql.connector.Error as e:
              # Lacks CREATE DATABASE privilege. Tell the user.
              print('Could not create database:', e)
              print('Run this on the MySQL host once:')
              print(\"  CREATE DATABASE bizzymod_stats CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\")
              print(\"  GRANT ALL ON bizzymod_stats.* TO '${MYSQL_USER}'\\\"@'%';\")
              print(\"  FLUSH PRIVILEGES;\")
              raise SystemExit(1)
          conn.commit()
          conn.close()
          PY
          "
          echo "::endgroup::"

          if [[ "${SKIP_SCHEMA}" != "true" ]]; then
              echo "::group::Apply schema migrations"
              plain_remote "
                  cd ${REMOTE_DIR} && \
                  python3 scripts/migrate.py \
                      --host '${MYSQL_HOST}' --port '${MYSQL_PORT}' \
                      --user '${MYSQL_USER}' --password '${MYSQL_PASS}' \
                      --database bizzymod_stats
              "
              echo "::endgroup::"
          fi

          if [[ "${SKIP_IMPORT}" != "true" ]]; then
              echo "::group::Import legacy l4d_stats data ${DRY_RUN_FLAG}"
              plain_remote "
                  cd ${REMOTE_DIR} && \
                  python3 migrate-legacy-stats.py \
                      --host '${MYSQL_HOST}' --port '${MYSQL_PORT}' \
                      --user '${MYSQL_USER}' --password '${MYSQL_PASS}' \
                      --legacy-db '${LEGACY_DB}' --new-db bizzymod_stats \
                      ${DRY_RUN_FLAG}
              "
              echo "::endgroup::"
          fi

          echo "::group::Clean up"
          plain_remote "rm -rf ${REMOTE_DIR}"
          echo "::endgroup::"
