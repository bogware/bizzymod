name: Deploy

on:
  # MANUAL ONLY. No push trigger — merging a PR never auto-deploys. Pick the
  # server (game mode) and the environment (dev/prod) when you run it.
  #   Actions -> Deploy -> Run workflow   (or: gh workflow run deploy.yml -f server=bizzymod -f environment=prod)
  #
  # STATUS (2026-10): CI deploys are NOT wired yet. The per-target GitHub
  # Environments (<server>-<environment>, e.g. bizzymod-prod) and their
  # secrets/vars do not exist, so a run fails fast at the Preflight step below.
  # Manual tar/rsync is the canonical deploy path today — see DEPLOY.md.
  workflow_dispatch:
    inputs:
      server:
        description: "Which server (game mode) to deploy"
        type: choice
        options:
          - campaign
          - vanilla
          - bizzymod
        # competitive gets added here once servers/competitive/ is populated.
        default: campaign
      environment:
        description: "Target environment (selects the GitHub Environment <server>-<environment>)"
        type: choice
        options:
          - dev
          - prod
        # prod is the only environment with a documented target; dev is manual
        # (see DEPLOY.md). Default to prod so a stray run doesn't silently aim
        # at an unwired dev target.
        default: prod
      skip_steam_update:
        description: "Skip steamcmd app_update (anonymous L4D2 installs are Valve-blocked; only runs when STEAM_USER/STEAM_PASS secrets are set)"
        type: boolean
        default: true

# One deploy per (server, environment) at a time.
concurrency:
  group: deploy-${{ inputs.server }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  L4D2_APPID: "222860"

jobs:
  deploy:
    # Self-hosted Linux runner (bogware). Build + deploy both run here; it is the
    # box with SSH reach to the game servers. Required tools are checked below.
    runs-on: [self-hosted, Linux]
    # Per-target secrets/vars live in the GitHub Environment "<server>-<environment>"
    # (e.g. campaign-prod, campaign-dev). See DEPLOY.md.
    environment: ${{ inputs.server }}-${{ inputs.environment }}
    timeout-minutes: 30

    steps:
      # ----------------------------------------------------------------------
      # FAIL-SAFE: CI deploys are not wired yet (no <server>-<environment>
      # GitHub Environment / secrets exist). Turn an accidental run into a
      # clear, early failure instead of a confusing half-deploy against an
      # empty environment. Remove this step once the Environments are created.
      - name: Preflight — refuse to run until this environment is wired
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "${SSH_HOST}" ]; then
            echo "::error::CI is not wired for '${{ inputs.server }}-${{ inputs.environment }}' (no such GitHub Environment / secrets). Deploy manually — see DEPLOY.md (## Status: CI is not wired yet)."
            exit 1
          fi
          echo "Environment '${{ inputs.server }}-${{ inputs.environment }}' is wired; proceeding."

      # ----------------------------------------------------------------------
      - name: Checkout monorepo
        uses: actions/checkout@v5
        with:
          lfs: false

      # ----------------------------------------------------------------------
      - name: Load per-server manifest (servers/<server>/deploy.env)
        id: manifest
        run: |
          set -euo pipefail
          SERVER="${{ inputs.server }}"
          SRV_DIR="servers/${SERVER}"
          [ -d "${SRV_DIR}" ]            || { echo "::error::Unknown server '${SERVER}' — no ${SRV_DIR}/ in the repo."; exit 1; }
          [ -f "${SRV_DIR}/deploy.env" ] || { echo "::error::${SRV_DIR}/deploy.env is missing (each server needs one)."; exit 1; }
          # Source the manifest and re-export its knobs to later steps.
          set -a; . "${SRV_DIR}/deploy.env"; set +a
          {
            echo "server_dir=${SRV_DIR}"
            echo "apply_zonemod=${APPLY_ZONEMOD_OVERLAY:-false}"
            echo "zonemod_tag=${ZONEMOD_RELEASE_TAG:-}"
            echo "quarantine_matchmode=${QUARANTINE_MATCHMODE:-false}"
            echo "quarantine_fixes=${QUARANTINE_FIXES:-}"
            echo "sourcemod_version=${SOURCEMOD_VERSION:-1.12.x}"
          } >> "${GITHUB_OUTPUT}"
          echo "Deploying '${SERVER}' from ${SRV_DIR} (zonemod=${APPLY_ZONEMOD_OVERLAY:-false})"

      # ----------------------------------------------------------------------
      - name: Verify runner has the required tools
        run: |
          set -euo pipefail
          # The self-hosted runner needs these preinstalled (it may not have
          # passwordless sudo, so we do NOT try to apt-get them here).
          missing=()
          for c in sshpass rsync curl tar ssh ssh-keyscan; do
            command -v "$c" >/dev/null 2>&1 || missing+=("$c")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Self-hosted runner is missing: ${missing[*]}. Install once on the runner host: sudo apt-get install -y sshpass rsync curl tar openssh-client"
            exit 1
          fi
          echo "Runner tools OK."

      # ----------------------------------------------------------------------
      - name: Checkout zonemod source (SourcePawn deps) — servers that use it
        if: steps.manifest.outputs.apply_zonemod == 'true'
        uses: actions/checkout@v5
        with:
          repository: SirPlease/L4D2-Competitive-Rework
          ref: ${{ steps.manifest.outputs.zonemod_tag }}
          path: zonemod

      # ----------------------------------------------------------------------
      - name: Setup SourcePawn compiler (match server's SourceMod line)
        uses: rumblefrog/setup-sp@1b616aebc2c70430364571e2b4ad4b719164c1f7 # v1.3.1
        with:
          version: ${{ steps.manifest.outputs.sourcemod_version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      - name: Compile this server's Bizzymod plugins
        run: |
          chmod +x .deploy/build-plugins.sh
          # BUILD_STRICT=1 => any compile failure (or a non-allowlisted plugin
          # with no .sp) fails the deploy instead of shipping a stale/placeholder .smx.
          BUILD_STRICT=1 .deploy/build-plugins.sh "${{ steps.manifest.outputs.server_dir }}"

      # ----------------------------------------------------------------------
      - name: Download zonemod Linux overlay — servers that use it
        if: steps.manifest.outputs.apply_zonemod == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.manifest.outputs.zonemod_tag }}"
          url="https://github.com/SirPlease/L4D2-Competitive-Rework/releases/download/${TAG}/L4D2-Competitive-Rework-${TAG}-linux.tar.gz"
          echo "Downloading ${url}"
          mkdir -p _zonemod_overlay
          curl -fSL "${url}" | tar -xz -C _zonemod_overlay
          ls -la _zonemod_overlay | head -20

      # ----------------------------------------------------------------------
      - name: Token-replace #{...}# in this server's cfgs
        env:
          # Per-environment identity (from the GitHub Environment):
          SERVER_NAME:        ${{ vars.SERVER_NAME }}
          RCON_PASS:          ${{ secrets.RCON_PASS }}
          SRCDS_USER:         ${{ vars.SRCDS_USER }}
          REMOTE_TARGET_FOLDER: ${{ vars.REMOTE_TARGET_FOLDER }}
          INIT_PATH:          ${{ vars.INIT_PATH }}
          # Shared DB creds (repo-level — every server/env reports to the same DBs):
          L4DSTATS_DB:        ${{ vars.L4DSTATS_DB }}
          L4DSTATS_DB_IP:     ${{ vars.L4DSTATS_DB_IP }}
          L4DSTATS_PORT:      ${{ vars.L4DSTATS_PORT }}
          L4DSTATS_USER:      ${{ vars.L4DSTATS_USER }}
          L4DSTATS_PASS:      ${{ secrets.L4DSTATS_PASS }}
          SOURCEBANS_DB:      ${{ vars.SOURCEBANS_DB }}
          SOURCEBANS_DB_IP:   ${{ vars.SOURCEBANS_DB_IP }}
          SOURCEBANS_PORT:    ${{ vars.SOURCEBANS_PORT }}
          SOURCEBANS_USER:    ${{ vars.SOURCEBANS_USER }}
          SOURCEBANS_PASS:    ${{ secrets.SOURCEBANS_PASS }}
          # Per-environment SourceBans server id (sbpp_comms hard-requires a valid, non-zero id).
          # Set in the GitHub Environment: e.g. bizzymod-prod=1, bizzymod-dev=3.
          SB_SERVERID:        ${{ vars.SB_SERVERID }}
        run: |
          chmod +x .deploy/replace-tokens.sh
          .deploy/replace-tokens.sh "${{ steps.manifest.outputs.server_dir }}"

      # ----------------------------------------------------------------------
      - name: Prepare SSH (password auth via sshpass)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      # ----------------------------------------------------------------------
      - name: Stop server, sync logs, (optional) refresh L4D2, deploy, restart
        env:
          SSHPASS:              ${{ secrets.SSH_PASSWORD }}
          SUDO_PASS:            ${{ secrets.SUDO_PASSWORD }}
          SSH_HOST:             ${{ secrets.SSH_HOST }}
          SSH_USER:             ${{ vars.SSH_USER }}
          SSH_PORT:             ${{ vars.SSH_PORT || '22' }}
          REMOTE_TARGET_FOLDER: ${{ vars.REMOTE_TARGET_FOLDER }}
          SRCDS_USER:           ${{ vars.SRCDS_USER }}
          INIT_PATH:            ${{ vars.INIT_PATH }}
          L4D2_APPID:           ${{ env.L4D2_APPID }}
          SKIP_STEAM_UPDATE:    ${{ inputs.skip_steam_update }}
          STEAM_USER:           ${{ secrets.STEAM_USER }}
          STEAM_PASS:           ${{ secrets.STEAM_PASS }}
          SERVER_DIR:           ${{ steps.manifest.outputs.server_dir }}
          APPLY_ZONEMOD:        ${{ steps.manifest.outputs.apply_zonemod }}
          QUARANTINE_MATCHMODE: ${{ steps.manifest.outputs.quarantine_matchmode }}
          QUARANTINE_FIXES:     ${{ steps.manifest.outputs.quarantine_fixes }}
        run: |
          set -euo pipefail

          remote() {
              # SSH auth uses SSH_PASSWORD (SSHPASS env). The sudo password is fed
              # to remote 'sudo -S -p ""' via stdin so it never hits the cmdline.
              SSHPASS="${SSHPASS}" sshpass -e ssh -o StrictHostKeyChecking=yes -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
                  "sudo -S -p '' bash -lc \"$1\"" <<< "${SUDO_PASS}"
          }

          echo "::group::Stop server (${INIT_PATH} stop)"
          remote "${INIT_PATH} stop || true"
          echo "::endgroup::"

          echo "::group::Copy logs to user home (best-effort)"
          remote "
              install -d -o ${SRCDS_USER} -g ${SRCDS_USER} /home/${SRCDS_USER}/bizzylogs /home/${SRCDS_USER}/bizzysourcemodlogs
              [ -d '${REMOTE_TARGET_FOLDER}/left4dead2/logs' ] && cp -a '${REMOTE_TARGET_FOLDER}/left4dead2/logs/.' /home/${SRCDS_USER}/bizzylogs/ || true
              [ -d '${REMOTE_TARGET_FOLDER}/left4dead2/addons/sourcemod/logs' ] && cp -a '${REMOTE_TARGET_FOLDER}/left4dead2/addons/sourcemod/logs/.' /home/${SRCDS_USER}/bizzysourcemodlogs/ || true
              chown -R ${SRCDS_USER}:${SRCDS_USER} /home/${SRCDS_USER}/bizzylogs /home/${SRCDS_USER}/bizzysourcemodlogs || true
          "
          echo "::endgroup::"

          # Valve blocks anonymous L4D2 dedicated installs; the base game is
          # installed out-of-band (see DEPLOY.md) and this validate is skipped
          # unless STEAM_USER/STEAM_PASS are set and skip_steam_update=false.
          if [[ "${SKIP_STEAM_UPDATE}" != "true" && -n "${STEAM_USER:-}" ]]; then
              echo "::group::steamcmd app_update ${L4D2_APPID}"
              SSHPASS="${SSHPASS}" sshpass -e ssh -o StrictHostKeyChecking=yes -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "
                  sudo -S -p '' -u ${SRCDS_USER} -H bash -lc \"/home/${SRCDS_USER}/steamcmd/steamcmd.sh +@sSteamCmdForcePlatformType linux +force_install_dir ${REMOTE_TARGET_FOLDER} +login ${STEAM_USER} ${STEAM_PASS} +app_update ${L4D2_APPID} validate +quit\"
              " <<< "${SUDO_PASS}"
              echo "::endgroup::"
          else
              echo "steamcmd app_update SKIPPED (anonymous is Valve-blocked; set STEAM_USER/STEAM_PASS + skip_steam_update=false to enable)."
          fi

          if [[ "${APPLY_ZONEMOD}" == "true" ]]; then
              echo "::group::Rsync zonemod overlay (laid down first, --delete-after resets tree to baseline)"
              # --delete-after resets the left4dead2 tree to the zonemod baseline,
              # which also wipes any stale/bad content already on the target (e.g.
              # a previous mode's leftovers) before our overlay lands on top.
              if [[ -d _zonemod_overlay/left4dead2 ]]; then
                  ZONE_SRC="_zonemod_overlay/left4dead2/"
              else
                  ZONE_SRC="_zonemod_overlay/"
              fi
              SSHPASS="${SSHPASS}" rsync -az --delete-after \
                  --exclude '.git/' \
                  -e "sshpass -e ssh -o StrictHostKeyChecking=yes -p ${SSH_PORT}" \
                  "${ZONE_SRC}" "${SSH_USER}@${SSH_HOST}:/tmp/bizzymod-stage-zonemod/"
              remote "
                  install -d ${REMOTE_TARGET_FOLDER}/left4dead2
                  rsync -a --delete-after /tmp/bizzymod-stage-zonemod/ ${REMOTE_TARGET_FOLDER}/left4dead2/
                  rm -rf /tmp/bizzymod-stage-zonemod
                  chown -R ${SRCDS_USER}:${SRCDS_USER} ${REMOTE_TARGET_FOLDER}
              "
              echo "::endgroup::"
          else
              echo "zonemod overlay SKIPPED (this server's deploy.env has APPLY_ZONEMOD_OVERLAY=false)."
          fi

          if [[ "${QUARANTINE_MATCHMODE}" == "true" ]]; then
              echo "::group::Quarantine matchmode plugins + nuke stale dirs"
              # SourceMod auto-loads every .smx in plugins/ AND its subdirectories
              # EXCEPT folders named 'disabled' or 'optional'. We quarantine only
              # the specific matchmode plugins that lock the server into Versus
              # rules (moving the whole plugins/ root breaks left4dhooks load order).
              remote "
                  PLUG=${REMOTE_TARGET_FOLDER}/left4dead2/addons/sourcemod/plugins
                  install -d \\\$PLUG/disabled
                  moved=0
                  for f in match_vote.smx confoglcompmod.smx reservedslots.smx; do
                      if [ -e \\\"\\\$PLUG/\\\$f\\\" ]; then
                          mv -f \\\"\\\$PLUG/\\\$f\\\" \\\$PLUG/disabled/
                          moved=\\\$((moved + 1))
                      fi
                  done
                  echo \\\"Quarantined \\\$moved matchmode plugin(s)\\\"

                  # Per-server extra fixes/ plugins to quarantine (from deploy.env).
                  for f in ${QUARANTINE_FIXES}; do
                      if [ -e \\\"\\\$PLUG/fixes/\\\$f\\\" ]; then mv -f \\\"\\\$PLUG/fixes/\\\$f\\\" \\\$PLUG/disabled/; fi
                  done

                  # Nuke a stale plugins/bizzymod/ from before the optional/bizzymod/ move.
                  if [ -d \\\$PLUG/bizzymod ]; then rm -rf \\\$PLUG/bizzymod; echo 'Removed stale plugins/bizzymod/'; fi

                  # Drop match-vote persistence so confoglcompmod can't replay.
                  rm -f ${REMOTE_TARGET_FOLDER}/left4dead2/addons/sourcemod/data/match_vote.txt
                  chown -R ${SRCDS_USER}:${SRCDS_USER} ${REMOTE_TARGET_FOLDER}/left4dead2/addons/sourcemod
              "
              echo "::endgroup::"
          fi

          echo "::group::Rsync ${SERVER_DIR} overlay (this repo wins on conflict)"
          # servers/<server>/ contains ONLY runtime content (addons, cfg, scripts,
          # host/motd). Stage to /tmp (no sudo over rsync), then move into place.
          SSHPASS="${SSHPASS}" rsync -az \
              --exclude '.git/' --exclude 'deploy.env' --exclude '*.md' \
              -e "sshpass -e ssh -o StrictHostKeyChecking=yes -p ${SSH_PORT}" \
              "${SERVER_DIR}/" "${SSH_USER}@${SSH_HOST}:/tmp/bizzymod-stage-server/"
          remote "
              rsync -a /tmp/bizzymod-stage-server/ ${REMOTE_TARGET_FOLDER}/left4dead2/
              rm -rf /tmp/bizzymod-stage-server
              chown -R ${SRCDS_USER}:${SRCDS_USER} ${REMOTE_TARGET_FOLDER}
              find ${REMOTE_TARGET_FOLDER}/left4dead2 -type d -exec chmod 755 {} +
              find ${REMOTE_TARGET_FOLDER}/left4dead2 -type f -exec chmod 644 {} +
              chmod +x ${REMOTE_TARGET_FOLDER}/srcds_run ${REMOTE_TARGET_FOLDER}/srcds_linux 2>/dev/null || true
          "
          echo "::endgroup::"

          echo "::group::Start server (${INIT_PATH} start)"
          remote "${INIT_PATH} start"
          sleep 5
          remote "pgrep -af srcds_run | head -5 || (echo 'srcds_run not running'; exit 1)"
          echo "::endgroup::"
